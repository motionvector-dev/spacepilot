# Publish workflow — makes every future release one click.
# Author Saurabh (2026-09-24): no token stored = the PyPI trusted publisher
# flow sends an OIDC token per run.
#
# PyPI one-time setup (does NOT live in this repo):
#   1. Go to pypi.org/manage/project/spacepilot/settings/publishing
#   2. Add a pending publisher with:
#        owner  = motionvector-dev
#        repo   = spacepilot
#        workflow = publish.yml
#        environment = pypi   (only if you gate by env; optional)
#   3. Done. This workflow NEVER stores a token.
#
# Tag a release (git tag v2.10.0 && git push origin v2.10.0) and this runs.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example v2.9.0)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify release tag and package version
        run: |
          python - <<'PYTAG'
          import ast, os, re, subprocess
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), "A version tag is required"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tagged = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          assert head == tagged, "Source must be the existing release tag"
          source = ast.parse(Path("spacepilot/__init__.py").read_text())
          version = next(ast.literal_eval(n.value) for n in source.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "__version__" for t in n.targets))
          assert tag == f"v{version}", "Package version does not match tag"
          PYTAG
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Stale build guard — the build/lib trap bit us on PR 167 (build/ from a
      # pre-flatten tree shipped deleted modules into a fresh wheel).
      - name: Clear stale build artifacts
        run: rm -rf build/ dist/ -- *.egg-info
      - name: Install build backend
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Sanity — version and no ghost modules in the wheel
        run: |
          python - <<'PY'
          import importlib.metadata, zipfile, pathlib
          whl = next(__import__('pathlib').Path('dist').glob('*.whl'))
          z = zipfile.ZipFile(whl)
          names = z.namelist()
          ghosts = [n for n in names if 'pluto' in n or 'enhance_prompt' in n]
          assert not ghosts, f"ghost modules in wheel: {ghosts}"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    environment: pypi   # matches the PyPI trusted-publisher environment, if configured
    permissions:
      id-token: write   # OIDC for PyPI trusted publishing, no token stored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/config. PyPI authenticates via the OIDC token.
        # If you see 'Publisher verification failed' check the one-time
        # PyPI settings at pypi.org/manage/project/spacepilot/settings/publishing

  release:
    permissions:
      contents: write
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4    # v4 is the current stable major
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the wheel attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          NOTES="RELEASE_NOTES_${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            # The recovered build comes from the same tag. Preserve existing
            # draft assets rather than replacing a release's artifact history.
            if test "$(gh release view "$TAG" --json assets --jq '.assets | length')" = 0; then
              gh release upload "$TAG" dist/*
            fi
            gh release edit "$TAG" --title "SpacePilot $TAG" --notes-file "$NOTES" --draft=false
          else
            gh release create "$TAG" --verify-tag --title "SpacePilot $TAG" --notes-file "$NOTES" dist/*
          fi
