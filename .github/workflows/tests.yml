name: tests

# CI runs only on the release branches and on PRs aimed at them. Every push to
# every branch used to trigger a run, and an unscoped pull_request trigger ran
# the same commit a second time: 60% of runner minutes went to feature branches
# nobody was gating on. Push to a feature branch freely; the gate is the PR.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main, dev]
    # Kept in sync with the push filter above by hand: GitHub Actions does not
    # support YAML anchors, so this list cannot be shared.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# A new push supersedes the run already in flight for the same ref. Runs on the
# release branches are never cancelled: their result is the record of whether
# that commit was good.
#
# pytest and packaging both run on lenovo-spacepilot, the one self-hosted
# runner for this repo (private repo only — never attach a self-hosted runner
# to a public one). A single runner only executes one job at a time, so the
# two already queue rather than race each other; this group additionally
# drops a superseded run instead of leaving it queued behind a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

# The product itself is macOS-only (videotoolbox, CoreML, MLX): no test asserts
# a successful videotoolbox render, so the suite is portable, but anything that
# starts depending on those encoders needs a macOS job instead.
jobs:
  pytest:
    runs-on: [self-hosted, lenovo]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # No sudo here, ever. lenovo-spacepilot's runner account has no
      # NOPASSWD sudoers entry, so `sudo apt-get ...` blocks on a tty
      # password prompt the Actions log can't show — confirmed live on the
      # host 2026-09-02 after it silently ate two job timeouts. ffmpeg and
      # libsndfile1 are already installed on lenovo-spacepilot; this step
      # only verifies that and fails with the exact commands to run by hand
      # if either is ever missing.
      - name: Verify system packages are present
        run: |
          missing=""
          command -v ffmpeg >/dev/null 2>&1 || missing="$missing ffmpeg"
          ldconfig -p 2>/dev/null | grep -q libsndfile || dpkg -s libsndfile1 >/dev/null 2>&1 || missing="$missing libsndfile1"
          if [ -n "$missing" ]; then
            echo "::error::Missing on this runner:${missing}. Install by hand (never via sudo in CI): sudo apt-get install -y --no-install-recommends${missing}" >&2
            exit 1
          fi

      # Install from the declared file, never a hand-typed list. Two PRs in a
      # row added a dependency, declared it correctly, and still went red here
      # because this step had its own private copy of the package list.
      # requirements-gpu.txt is deliberately not installed: the GPU worker is
      # stubbed in tests and its CUDA wheels are ~2.5 GB per run.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  # The gate the other 369 tests could not be. Everything else runs against a
  # source checkout, which is why v2.8.0 shipped with a CLI whose main commands
  # exited 1 on a real install. Its own job because it builds a wheel and makes
  # a venv, and because a red here means "the release is broken", not "a test
  # is broken".
  packaging:
    runs-on: [self-hosted, lenovo]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # See the pytest job's identical step above: no sudo here, ever —
      # verified present, or fails with the exact command for Saurabh.
      - name: Verify system packages are present
        run: |
          missing=""
          command -v ffmpeg >/dev/null 2>&1 || missing="$missing ffmpeg"
          ldconfig -p 2>/dev/null | grep -q libsndfile || dpkg -s libsndfile1 >/dev/null 2>&1 || missing="$missing libsndfile1"
          if [ -n "$missing" ]; then
            echo "::error::Missing on this runner:${missing}. Install by hand (never via sudo in CI): sudo apt-get install -y --no-install-recommends${missing}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -m packaging overrides the `not packaging` in pyproject's addopts.
      - name: Install the wheel and run the CLI
        run: python -m pytest tests/test_wheel_install.py -m packaging -q

  # Two gates the repo went 38 merged PRs without. Both are free on
  # ubuntu-latest and finish in seconds, so they run as their own job rather
  # than lengthening the one people wait on. Left on ubuntu-latest rather than
  # moved to lenovo-spacepilot: measured across several runs this job takes
  # ~30-35s end to end, under the bar for moving it (2026-09-02).
  security:
    runs-on: [self-hosted, lenovo]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # Pinned, because a bandit upgrade can change finding ids and make the
      # baseline below stop matching for reasons that have nothing to do with
      # the code under test.
      - name: Install scanners
        run: python -m pip install --upgrade pip "bandit==1.9.4" pip-audit

      # Known CVEs in what we actually declare. If this goes red on a
      # dependency you did not touch, that is the tool working: a new advisory
      # landed. Fix by upgrading, or add --ignore-vuln <ID> with a comment
      # saying why it does not reach us.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      # Fails on findings that are NOT in .bandit-baseline.json. The baseline
      # is 23 pre-existing medium-severity findings, recorded rather than
      # waved away — it is a debt list, and the gate stops it growing.
      # Regenerate deliberately, never to make a red run green:
      #   bandit -r spacepilot/ -ll -f json -o .bandit-baseline.json
      - name: Scan for new security findings
        run: bandit -r spacepilot/ -ll --baseline .bandit-baseline.json
