     ========================================================================== -->

  <div class="popover-header">
    <div class="header-left">
      <span class="idle-badge mono">IDLE · PASSIVE</span>
      <span class="model-title">M1 Max (32GB)</span>
    </div>
    <div class="header-right mono">
      <span class="passive-status">0 RPM Quiet</span>
