name: Qwen3.5 35B-A3B Base
family: qwen
kind: text
summary: >
  The upstream sparse-MoE base Edge0 builds its 35B-A3B preview on top of:
  35B total parameters, ~3B active per token, hybrid Gated DeltaNet / Gated
  Attention MoE layout, 262K native context (extensible to ~1M). Registered
  here as the base checkpoint reference, not as an Edge0-runtime variant --
  distinct from qwen1-5-moe and qwen3-6-27b already in this registry.
homepage: https://huggingface.co/Qwen/Qwen3.5-35B-A3B-Base

