    notes: >
      Edge0 runtime source: https://github.com/Edge0-AI/edge0 (Apache-2.0). Same
      SSD Expert Offload / Prerouter / Recover-LoRA stack as edge0-35b-a3b-preview
      (see that manifest for the mechanism descriptions).

      CORRECTION to the base-model assumption this entry was requested under:
      the Edge0-8B-A1B-preview model card (checked 2026-09-10) names its base as
      inclusionAI/Ling-3.0-tiny-base, a Bailing-MoE architecture with 128 experts
      (8 selected per token) -- not Qwen3.5-MoE, which is the base only for the
      35B-A3B sibling. Recorded here as verified fact rather than carried forward
      unchecked from the request.

      Limitations note, verbatim from the Edge0-8B-A1B-preview model card
      (checked 2026-09-10): "Agent capability: this preview release is not yet
      optimized for agentic tasks -- tool use, multi-step planning, and
      long-horizon autonomy are currently weak." The card adds that "the full
      release will substantially strengthen agent capability."

      Status: unflown. No speed entries recorded -- nobody has run this on a
      SpacePilot-probed machine yet.
