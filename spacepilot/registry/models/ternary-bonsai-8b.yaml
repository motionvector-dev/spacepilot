      source: huggingface-api
      checked: "2026-09-10"
      note: >
        Whole repo at the pinned commit -- four safetensors shards
        (~15.3 GiB total) plus tokenizer/config. This is the unquantized
        ternary-value representation (one float per weight, not yet
        bit-packed); the GGUF variant below is the packed 2.03 GiB
