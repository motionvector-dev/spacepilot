    working_set:
      value: 17587891322
      source: estimated
      checked: "2026-09-10"
      note: >
        Estimated as download size plus ~7.5% for KV cache and runtime
        buffers at a short context, the same multiplier convention used
        elsewhere in this registry for an unquantized checkpoint. No
        publisher figure exists for this specific unpacked artifact -- the
        publisher's own memory numbers (see the GGUF variant) are for the
        packed Q2_0 build, not this one.
    speed: []
    notes: >
      Base model: Qwen/Qwen3-8B (Apache-2.0), requantized ternary by Prism
      ML. This is the unpacked/base_model repo the GGUF variant below
      quantizes from -- registered separately because it is the weight
      source the SpacePilot MLX build path (mlx-2bit sibling repo, not
