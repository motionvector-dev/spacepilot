schema: 1
id: ternary-bonsai-8b
name: Ternary Bonsai 8B
family: bonsai
kind: text
summary: >
  Prism ML's ternary (1.58-bit) requant of Qwen3-8B: every weight in {-1, 0,
  +1} with a per-128-weight FP16 group scale (GGUF Q2_0 g128, 2.125 bits/
  weight effective). Publisher-measured against same-size full-precision
  models on identical EvalScope/vLLM infrastructure -- see `notes` for the
  numbers and their important caveat: Q2_0 for ternary weights is not yet
  in mainline `llama.cpp`, only in Prism ML's own fork.
homepage: https://huggingface.co/prism-ml/Ternary-Bonsai-8B-gguf

license:
  id: apache-2.0
  spdx: Apache-2.0
  open_source: true
  url: https://www.apache.org/licenses/LICENSE-2.0

variants:
  - id: ternary-bonsai-8b-unpacked
    name: Ternary Bonsai 8B (unpacked safetensors)
    params: 8.19B (~6.95B non-embedding)
    precision: ternary (1.58-bit, unpacked bf16-scale safetensors)
    repo: prism-ml/Ternary-Bonsai-8B-unpacked
    revision: ac20f03fc62e872399218b659c8e949dfca05769
    backends: [cpu, cuda, metal]
    download:
