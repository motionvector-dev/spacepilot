      L2R typed tasks, per the ternary/1.58-bit registration brief
      (2026-09-10).

  - id: ternary-bonsai-8b-gguf-q2-0
    name: Ternary Bonsai 8B (GGUF Q2_0, g128)
    params: 8.19B (~6.95B non-embedding)
    precision: ternary (1.58-bit, GGUF Q2_0 g128)
    repo: prism-ml/Ternary-Bonsai-8B-gguf
    revision: c2aefbeb4b24469cd11579c3384b990404c17a30
    files: ["Ternary-Bonsai-8B-Q2_0.gguf"]
    backends: [cpu, metal]
    download:
      value: 2182184672
      source: huggingface-api
      checked: "2026-09-10"
      note: >
        The single recommended Q2_0 g128 file at the pinned commit (2.03
        GiB). The same repo also ships an F16 baseline (16.38 GB, for
        re-quantization) and a PQ2_0/Q2_0_g64 variant not registered here.
    working_set:
      value: 2182184672
      source: declared
      checked: "2026-09-10"
      note: >
        Model card's own memory table: "GGUF Q2_0 g128: 2.03 GiB (2.18 GB)"
        against a 16.38 GB FP16 baseline, a 7.5x reduction -- publisher
        claim, not a SpacePilot measurement of resident memory during a run.
    speed:
      - device: Apple M4 Pro 48GB
        backend: metal
        metric: tokens_per_second
        value: 76.0
        source: declared
        measured_on: "2026-09-10"
        note: >
          Publisher's own throughput table (llama.cpp, Apple M4 Pro 48 GB,
          TG128 decode, `-ngl 99 -fa 1`, requires Prism ML's llama.cpp fork
          for Q2_0 support -- not mainline). Declared by the publisher's own
          README, not run on SpacePilot's fleet; kept as a `speed` entry
          because the registry schema requires a `source`, and this one is
          honestly `declared` rather than `measured`.
    caveats:
      - capability: audio.transcription
        status: absent
        provenance: declared
        detail: >
          Text-only chat model; no audio path. Listed for completeness
          against this registry's caveat taxonomy, not because anyone
          claimed otherwise.
    notes: >
      Quantization: GGUF Q2_0 g128, each weight {-1, 0, +1} with one shared
      FP16 scale per 128-weight group -- 34 bytes/block, 2.125 bits/weight
      effective (the Q2_0 4th code point, +2*scale, is reserved and unused
      for ternary weights). Kernel note from the model card, verbatim
      (checked 2026-09-10): "Q2_0 is not yet in mainline llama.cpp. Use our
      fork at PrismML-Eng/llama.cpp (prism branch, default) which adds Q2_0
      support for CPU (NEON/generic) and Metal." So `backends: [cpu, metal]`
      here describes the fork's support, not mainline llama.cpp's -- a
      plain mainline build will not read this file's quantization
      correctly. The Hub listing also tags this repo `cuda`, but the Q2_0
      kernel README quoted above only documents CPU and Metal support --
      `backends` here follows the README over the tag, so CUDA is left out
      rather than asserted on a tag alone.

      Runtime recipe: spacepilot/registry/runtimes/llama-cpp-prism.yaml,
      pinned to PrismML-Eng/llama.cpp@d8f26eec76da6d09bb708bcba51ef64b8cd868a3
      (verified public fork, `fork: true`, `default_branch: prism`, checked
      2026-09-10) -- llama-cpp-python's pip wheel vendors mainline
      llama.cpp, not this fork, so it cannot read this file's Q2_0
      quantization either; the fork has to be built directly. Not attempted
      this pass -- a default llama.cpp CMake configure enables the Metal
      backend on Apple Silicon by itself, a full build, not a small or
      quick one; see the recipe's own notes for the build command.

      Publisher-measured accuracy (checked 2026-09-10, EvalScope v1.4.2 +
      vLLM 0.15.1 on one H100, "identical infrastructure, generation
      parameters, and scoring" across all rows, all models 6B-9B params):
      avg 75.5 (MMLU-R 72.6, MuSR 56.2, GSM8K 91, HumanEval+ 77.4, IFEval
      81.8, BFCL 73.9) at 2.18 GB, second only to full-precision Qwen3-8B's
      79.3 at 16.38 GB among the models in that table, and ahead of RNJ 8B,
      Ministral3 8B and Olmo 3 7B (all full-precision, all larger on disk).
      All of the above is the publisher's own eval run, not reproduced by
      SpacePilot -- the point of flying this variant is exactly to check it.

      Status: unflown. Executor-candidate role for the router bench and the
      L2R typed tasks, per the ternary/1.58-bit registration brief
      (2026-09-10).
