schema: 1
id: whisper
name: Whisper
family: openai
kind: transcription
summary: >
  Speech to text, in the GGML builds whisper.cpp reads. One of these plus a VAD
  is the whole of subtitles, burn-in captions, filler-word removal and silence
  trimming — none of which needs a GPU.
homepage: https://huggingface.co/ggerganov/whisper.cpp

license:
  id: mit
  spdx: MIT
  open_source: true
  url: https://opensource.org/license/mit

