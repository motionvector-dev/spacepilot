      note: >
        Sum of the 14 files named above from the Hub tree on this date.
        Excludes README, .gitattributes, and the wheels/ directory.
        The checkpoint is natively ternary, packed 2-bit, not a 4-bit
        quant of a bf16 model.
    working_set:
      value: 6396387959
      source: estimated
      note: >
        5.33 GB decimal cached payload plus a provisional 20% allowance
        for a short KV cache and runtime overhead. A later hello on this
        machine peaked at 6.96 GB. DeepGrove's own M4 table lists about
        6.5 GB peak with their fork; that number is theirs.
    notes: >
      config.json sets model_file to maple.py, and stock mlx-lm 0.31.3
      loads that file. A hello on this machine (Python 3.11, mlx-lm
      0.31.3) answered and recorded 132 tok/s, 0.91 s load, 6.96 GB peak
      on 2026-09-22. The published kernel wheels are cp312 and cp313
      only; this short run did not need them.
