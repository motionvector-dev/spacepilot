id: edge0-35b-a3b-preview
name: Edge0 35B-A3B (preview)
family: edge0
kind: text
summary: >
  35B-total / ~3B-active MoE preview from the Edge0 runtime: SSD expert
  streaming keeps the active set under ~3 GiB resident, a trained prerouter
  overlaps expert loads with the forward pass, and a Recover-LoRA adapter
  claws back most of the loss the frozen int4 base takes from quantization.
  Built on Qwen3.5-MoE 35B-A3B.
homepage: https://huggingface.co/Edge0/Edge0-35B-A3B-preview

