kind: video
summary: >
  ByteDance Seed's diffusion-based video and image upscaler/restorer, not a
  text-to-image model — mflux runs it as a restoration pass rather than a
  generator. Packaged for ComfyUI by numz; both the wrapper and the upstream
  ByteDance-Seed/SeedVR project are Apache 2.0.
