schema: 1
id: distil-whisper
name: Distil-Whisper
family: distil-whisper
kind: transcription
summary: >
  A distilled Whisper large-v3 in the GGML build whisper.cpp reads. Faster than
  its parent at transcription. Only segment-level output was distilled, so word
  timestamps are inherited from the parent's attention heads untrained — fine
  for subtitles, wrong for cutting on a word boundary. That follows from the
  distillation method; SpacePilot has not measured it, and it is deliberately
  not a caveat entry because no published source states it.
homepage: https://huggingface.co/distil-whisper/distil-large-v3-ggml

