    notes: >
      Serves through runtime `coreai` via the patched llm-runner. Thinking
      flag defaults ON for this runtime: with `enable_thinking=False` the
      checkpoint answers 2h11m on the train-arithmetic step; the correct
      2h13m needs the think budget on both the int8 bundle and the HF fp16
      reference. Warmup must be off for this bundle — the engine's default
      warmup crashes on batch-256 shape substitution against a 1-token
      prefill graph (checked 2026-09-22, CoreAIPipelinedEngine warmup). The
      runner has no working stop-token path in the pipelined engine,
      generation is capped only by --max-tokens (checked 2026-09-22).
