name: Qwen3.5 9B (Core AI)
family: qwen
kind: text
summary: >
  Qwen3.5 9B, the text decoder of the dense bf16 checkpoint, exported as the
  first Core AI `.aimodel` bundle SpacePilot ships. Registered here with the
  gate history on record: G1 (16-token greedy match to the Hugging Face
  continuation) and G3 (512-token state gate) pass on the int8hu bundle; the
  G2 train-arithmetic item fails with thinking off and passes with thinking
  on — checked against the Hugging Face checkpoint itself, so the failure is
  the checkpoint's, not the bundle's. Thinking-on is the default for this
  runtime. Not served by default until the long gate passes; the bundle is
  gated 2026-09-22, the honesty checks were re-run 2026-09-24.
homepage: https://huggingface.co/Qwen/Qwen3.5-9B

