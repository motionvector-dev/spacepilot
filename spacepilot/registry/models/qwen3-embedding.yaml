      note: Sum of the nine inference files named above; excludes README, chat template, generation config and .gitattributes.
    working_set:
      value: 664721604
      source: measured
      checked: "2026-09-02"
      note: >
        MLX peak memory on Apple M1 Max embedding three sentences of at most
        ten tokens each, 8-bit weights. A floor for short inputs, not a ceiling:
        a long document raises activations, and this says nothing about batch.
    notes: >
      config.json declares model_type qwen3, so mlx_lm.load() loads it as an
      ordinary Qwen3 causal model. The embedding is the final normed hidden
      state at the last token, L2 normalised — 1024 dimensions. There is no
      separate embeddings package involved; mlx-embeddings is not installed
      here and is not a dependency.
