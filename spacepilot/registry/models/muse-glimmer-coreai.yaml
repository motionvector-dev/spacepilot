id: muse-glimmer-coreai
name: Muse Glimmer 30B (CoreAI)
family: muse
kind: text
summary: >
  Meta's 30B-parameter on-device agentic language model optimized for Apple Silicon
  via Apple's CoreAI runtime with DFlash speculative decoding (K=4 drafter),
  ANE/GPU heterogeneous dispatch, and Meta ATEM XML tool calling / reasoning streaming.
homepage: https://huggingface.co/meta-models/Muse-Glimmer-30B

