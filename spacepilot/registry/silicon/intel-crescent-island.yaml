summary: >-
  The counter-argument to HBM. Intel pairs a large LPDDR5X pool with an
  inference-optimised GPU and competes on capacity per watt per dollar rather
  than bandwidth — the clearest case that two accelerators with similar memory
  can be structurally different products.
