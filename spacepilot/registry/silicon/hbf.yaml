id: hbf
name: High Bandwidth Flash
vendor: SanDisk and SK hynix
kind: memory
availability: sampling
summary: >-
  A new tier between HBM and SSD, and the reason a machine's memory can no longer
  be one number. 512 GB at flash economics with a bandwidth range that overlaps
  HBM at the top and SSDs at the bottom.
