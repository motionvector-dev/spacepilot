note: >-
  12-core CPU described as 2 super cores, 4 performance cores and 6 efficiency
  cores, with a 12-core GPU. Apple lists a "Dual 16-core Neural Engine" — two
  NPUs on a base part, which no backend vocabulary in this project can express.
  Shipped alongside the M5 Pro, so this line carries two chip generations at once.
