id: flux
name: FLUX.1
family: black-forest-labs
kind: image
summary: 'Black Forest Labs'' rectified-flow transformer for text-to-image. schnell is the
  distilled, few-step, permissively-licensed variant; dev is the higher-quality full model
  under a non-commercial license. Run here through mflux (registry/runtimes/mflux.yaml), which
  quantizes and executes on Metal.

  '
