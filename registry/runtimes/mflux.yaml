schema: 1
id: mflux
name: MFLUX
summary: >
  MLX-native image generation for Apple Silicon. A line-by-line port of the
  diffusers pipelines, so it runs on Metal without going through PyTorch's MPS
  compatibility layer.
homepage: https://github.com/mflux-community/mflux
serves: [image, video]
backends: [metal]
license: MIT

install:
  method: pip
  package: mflux
  min_version: "0.19.0"
  checked: "2026-08-22"
python_requires: ">=3.10"

verify:
  import: mflux

runs:
  - flux
  - qwen-image
  - z-image
  - fibo
  - ernie-image
  - ideogram
  - seedvr2
  - boogu
  - lens
  - flux2-klein
notes: >
  Apple Silicon only. There is no CUDA path — on an NVIDIA machine the image
  runtime is diffusers instead. mflux 0.19.0's built-in model list covers ten
  families beyond FLUX.1 itself: Qwen-Image, Z-Image, FIBO, ERNIE-Image,
  Ideogram 4, SeedVR2 (video/image restoration, not text-to-image), Boogu,
  Lens, and FLUX.2 Klein. Licensing is heterogeneous — FIBO, Ideogram 4, and
  the FLUX.2 Klein 9B checkpoints are non-commercial and gated; see the
  individual registry/models/*.yaml files before assuming any of them can
  ship in a commercial product.
