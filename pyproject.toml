[project]
name = "spacepilot"
version = "2.8.0"
description = "SpacePilot: High-performance generative cinema workstation and compute platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "MotionVector", email = "dev@motionvector.io" }
]
keywords = ["inference", "orchestration", "gpu", "scheduling", "local-first", "mlx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100.0,<1.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "httpx>=0.24.0",
    "mcp>=2.0,<3",  # 2.0 renamed FastMCP to MCPServer; 1.x will not import
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "litellm>=1.98.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
local-ml = [
    "onnxruntime>=1.16.0",
    "kokoro-onnx>=0.3.0",
    "torch>=2.1.0",
    "scipy>=1.11.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://spacepilot.dev"
Source = "https://github.com/motionvector-dev/spacepilot"

[project.scripts]
pluto = "spacepilot.cli:main"
spacepilot = "spacepilot.cli:main"

[tool.setuptools.packages.find]
# Without this, setuptools flattened the source tree into sixteen generic
# top-level modules (`cli`, `engines`, `web_api`). See #43. Do not widen it.
include = ["spacepilot*"]

[tool.setuptools.package-data]
# `packages.find` ships .py files and nothing else, which is how the registry
# — the catalogue the CLI reads at startup — shipped as zero entries and made
# `spacepilot models list` exit 1 on every clean install.
spacepilot = [
    "registry/**/*.yaml",
    "registry/**/*.yml",
    "registry/**/*.md",
]

[build-system]
# 77.0 is the floor for PEP 639 license expressions; 83.0 is the floor for
# PYSEC-2026-3447. Take the higher one.
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
