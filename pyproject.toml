[project]
name = "pluto"
version = "2.8.0"
description = "SpacePilot: High-performance generative cinema workstation and compute platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MotionVector", email = "dev@motionvector.io" }
]
dependencies = [
    "fastapi>=0.100.0,<1.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "httpx>=0.24.0",
    "mcp>=2.0,<3",  # 2.0 renamed FastMCP to MCPServer; 1.x will not import
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
local-ml = [
    "onnxruntime>=1.16.0",
    "kokoro-onnx>=0.3.0",
    "torch>=2.1.0",
    "scipy>=1.11.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
pluto = "src.cli:main"
spacepilot = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
