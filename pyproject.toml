[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "space-voice"
version = "0.1.0"
description = "SpacePilot Native macOS real-time voice pair-programming assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets",
    "sounddevice",
    "numpy",
    "google-genai",
    "rich",
    "pydantic"
]

[project.scripts]
space-voice = "space_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/space_voice"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
