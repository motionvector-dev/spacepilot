[project]
name = "spacepilot"
# Read from spacepilot/__init__.py — the one place the version is written.
# It used to be pinned here, in __init__.py and in core/config.py at once.
dynamic = ["version"]
description = "SpacePilot: Inference orchestration across the machines you can reach"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "MotionVector", email = "dev@motionvector.io" }
]
keywords = ["inference", "orchestration", "gpu", "scheduling", "local-first", "mlx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100.0,<1.0",
    "starlette>=0.37",  # imported directly by spacepilot/api/security.py, not only via fastapi
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.9",  # fastapi upload parsing, imported by spacepilot/api/routes/assets.py
    "pydantic>=2.0",
    "httpx>=0.24.0",
    "mcp>=2.0,<3",  # 2.0 renamed FastMCP to MCPServer; 1.x will not import
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "Pillow>=10.0",  # spacepilot/services/image_utils.py, spacepilot/api/routes/generate.py
    "PyYAML>=6.0",
    "packaging>=23.0",  # spacepilot/runtimes.py parses the interpreter gates shown by `runtimes list`
    "huggingface_hub>=0.20",  # paths.py resolves the shared model cache
    "litellm>=1.98.0",
    "psutil>=5.9.0",
    "rich>=13.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
local-ml = [
    "onnxruntime>=1.16.0",
    "kokoro-onnx>=0.3.0",
    "faster-whisper>=1.0.0",
    "torch>=2.1.0",
    "scipy>=1.11.0",
]
# The stack `spacepilot/ltx_worker.py` needs, and only it.  The worker runs on
# the GPU box, never on a laptop or in CI, so none of this is a core dependency
# — installing it on ubuntu-latest pulls ~2.5 GB of CUDA wheels per run.
# Mirrors requirements-gpu.txt; keep the two together.
gpu-worker = [
    "flask>=3.0",
    "torch>=2.1.0",
    "torchao>=0.1",
    "transformers>=4.36.0",
    "diffusers>=0.25.0",
    "accelerate>=0.25.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    # tests/test_ltx_worker.py builds the worker's Flask test client to assert
    # its auth and path-traversal refusals.  Without flask those seven security
    # tests do not fail — they error out and read as infrastructure noise.
    "flask>=3.0",
]
# spacepilot/services/anthropic_provider.py, the remote rung behind
# /v1/chat/completions for claude-* models. Not installed in CI: the import
# lives inside AnthropicProvider._get_client, never at module level, and
# tests inject a fake client rather than exercising the real SDK — same
# pattern as mlx-lm, which also never appears in requirements.txt.
cloud = [
    "anthropic>=0.40.0",
]

[project.urls]
Homepage = "https://spacepilot.dev"
Source = "https://github.com/motionvector-dev/spacepilot"

[project.scripts]
spacepilot = "spacepilot.cli:main"
spacepilot-mcp = "spacepilot.mcp_server:main"

[tool.setuptools.packages.find]
# Without this, setuptools flattened the source tree into sixteen generic
# top-level modules (`cli`, `engines`, `web_api`). See #43. Do not widen it.
include = ["spacepilot*"]

[tool.setuptools.dynamic]
version = {attr = "spacepilot.__version__"}

[tool.setuptools.package-data]
# `packages.find` ships .py files and nothing else, which is how the registry
# — the catalogue the CLI reads at startup — shipped as zero entries and made
# `spacepilot models list` exit 1 on every clean install.
# `web/` is the Studio frontend, and it lives inside the package for the same
# reason the registry does: a wheel without it serves HTTP 500 on every page
# README.md advertises as the first run.  v2.8.0 shipped exactly that.
spacepilot = [
    "registry/**/*.yaml",
    "registry/**/*.yml",
    "registry/**/*.md",
    "web/**/*.html",
    "web/**/*.js",
    "web/**/*.mjs",
    "web/**/*.css",
    "web/**/*.json",
    "web/**/*.svg",
    "web/**/*.png",
    "web/**/*.ico",
    "web/**/*.webp",
    "web/**/*.woff",
    "web/**/*.woff2",
]

[build-system]
# 77.0 is the floor for PEP 639 license expressions; 83.0 is the floor for
# PYSEC-2026-3447. Take the higher one.
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "packaging: builds and installs the wheel. Slow, and needs the network for the build backend.",
]
# Deselected from the default run, not from CI: the packaging job runs
# `pytest -m packaging`, and a later -m on the command line overrides this one.
# -rs: every skip names itself in the summary. A gate that stops
# running must read loudly, never as a quiet green.
addopts = "-m 'not packaging' -rs"
