<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpacePilot Voice Studio · Real-Time Duplex Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-root: #000000;
      --bg-ground: #09090b;
      --bg-panel: #111114;
      --bg-card: #18181b;
      --bg-raised: #222226;
      --glass: rgba(17, 17, 20, 0.85);
      --glass-card: rgba(24, 24, 27, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-highlight: rgba(255, 255, 255, 0.22);
      --border-focus: rgba(255, 255, 255, 0.35);
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --text-inverse: #09090b;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.65);
      --shadow-glow-emerald: 0 0 24px rgba(16, 185, 129, 0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg-root);
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    ::selection { background: var(--emerald); color: var(--text-inverse); }

    /* ------------------------------------------------------------------
     * Compatibility utility classes.
     * voice.html's inline <script> sets/replaces these exact class names
     * directly (classList.add/remove and full className reassignment).
     * The script is out of scope for this restyle, so these names must
     * stay put — only their token mapping changed (was default Tailwind
     * palette, now DESIGN.md tokens).
     * ---------------------------------------------------------------- */
    .font-mono { font-family: var(--font-mono); }
    .font-bold { font-weight: 700; }
    .transition { transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease; }
    .scale-105 { transform: scale(1.05); }
    .border { border-width: 1px; border-style: solid; border-color: var(--border-medium); }
    .rounded-lg { border-radius: 10px; }
    .px-4 { padding-left: 16px; padding-right: 16px; }
    .py-2 { padding-top: 8px; padding-bottom: 8px; }
    .text-xs { font-size: 12px; line-height: 16px; }

    .text-amber-400 { color: var(--amber); }
    .text-emerald-400 { color: var(--emerald); }
    .text-rose-400 { color: var(--rose); }
    .text-zinc-500 { color: var(--text-muted); }
    .text-zinc-400 { color: var(--text-secondary); }
    .text-zinc-300 { color: var(--text-secondary); }
    .text-zinc-200 { color: var(--text-primary); }
    /* SpacePilot's tokens carry no cyan accent; the "speaking" state maps
       onto emerald, the same hue the tokens already assign to the audio
       track. */
    .text-cyan-400 { color: var(--emerald); }
    .border-cyan-400 { border-color: var(--emerald) !important; }

    .bg-zinc-900 { background-color: var(--bg-card); }
    .bg-zinc-900:hover { background-color: var(--bg-raised); }
    .border-zinc-700 { border-color: var(--border-medium); }

    .bg-rose-950 { background-color: rgba(244, 63, 94, 0.12); }
    .border-rose-800 { border-color: rgba(244, 63, 94, 0.4); }
    .text-rose-300 { color: color-mix(in srgb, var(--rose) 70%, white 30%); }

    /* ------------------------------------------------------------------
     * Page layout
     * ---------------------------------------------------------------- */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
    }

    .brand-mark svg { width: 18px; height: 18px; color: var(--text-inverse); }

    .brand-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      background: var(--bg-card);
      color: var(--emerald);
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    .telemetry {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .telemetry-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .telemetry-item.rtt,
    .telemetry-item.aec { display: none; }

    @media (min-width: 768px) {
      .telemetry-item.rtt,
      .telemetry-item.aec { display: flex; }
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--emerald);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    .orb-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      padding: 32px 0;
    }

    .orb-click-target {
      position: relative;
      width: 224px;
      height: 224px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    @property --aur {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes orb-spin { 0% { --aur: 0deg; } 100% { --aur: 360deg; } }

    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: conic-gradient(from var(--aur), var(--emerald), var(--bg-raised), var(--emerald));
      animation: orb-spin 4s linear infinite;
      opacity: 0.55;
      filter: blur(24px);
      transition: opacity 0.3s ease;
    }

    .orb-core {
      position: relative;
      z-index: 1;
      width: 176px;
      height: 176px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 2px solid var(--border-medium);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .orb-core svg { width: 48px; height: 48px; color: var(--text-secondary); transition: color 0.2s ease; }

    .orb-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 10px;
    }

    .vu-track {
      width: 256px;
      height: 6px;
      background: var(--bg-card);
      border-radius: 999px;
      margin-top: 32px;
      overflow: hidden;
    }

    .vu-fill {
      height: 100%;
      width: 0%;
      background: var(--emerald);
      transition: width 75ms linear;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      padding: 8px 16px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .btn:hover { background: var(--bg-raised); border-color: var(--border-highlight); }

    .transcript-box {
      width: 100%;
      background: var(--glass-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      max-height: 192px;
      overflow-y: auto;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
      margin-top: 16px;
    }

    .transcript-box > div + div { margin-top: 8px; }

    .transcript-empty { color: var(--text-muted); font-style: italic; }

    .footer {
      border-top: 1px solid var(--bg-card);
      padding: 16px 24px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header class="header">
    <div class="brand">
      <div class="brand-mark">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
      </div>
      <div>
        <h1 class="brand-title">
          SpacePilot Voice Studio <span class="badge-live">LIVE 2.5 AUDIO</span>
        </h1>
      </div>
    </div>

    <!-- Telemetry Badges -->
    <div class="telemetry">
      <div class="telemetry-item">
        <span class="status-dot"></span>
        <span id="connStatus">DISCONNECTED</span>
      </div>
      <div class="telemetry-item rtt">
        <span>RTT:</span> <strong id="rttDisplay" style="color: var(--text-primary);">-- ms</strong>
      </div>
      <div class="telemetry-item aec">
        <span>AEC:</span> <strong style="color: var(--emerald);">ENABLED</strong>
      </div>
    </div>
  </header>

  <!-- Main Voice Orb Stage -->
  <main class="main">

    <!-- Active Voice Orb Stage (Direct 1-Click Zero Auth) -->
    <div id="orbStage" class="orb-stage">

      <!-- The Pulsing Glowing Orb -->
      <div class="orb-click-target" id="orbClickTarget">
        <div id="orbRing" class="orb-ring"></div>
        <div id="orbCore" class="orb-core">
          <svg id="micIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
          <span id="orbStateLabel" class="orb-label">Connecting...</span>
        </div>
      </div>

      <!-- Real-Time Decibel Volume Meter -->
      <div class="vu-track">
        <div id="vuMeter" class="vu-fill"></div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="muteBtn" class="px-4 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-xs font-mono text-zinc-300 transition">
          🎤 Mic: ON
        </button>
        <button id="interruptBtn" class="btn">
          ⚡ Interrupt (Spacebar)
        </button>
      </div>
    </div>

    <!-- Live Transcript & Model Thought Stream -->
    <div id="transcriptBox" class="transcript-box">
      <div class="transcript-empty">Conversations and live assistant responses stream here automatically...</div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    SpacePilot Native WebAudio Bridge · Key Injected via Doppler · 0% Telemetry
  </footer>

  <script>
    let ws = null;
    let audioContext = null;
    let mediaStream = null;
    let micProcessor = null;
    let isMuted = false;
    let isConnected = false;

    const connStatus = document.getElementById('connStatus');
    const orbStateLabel = document.getElementById('orbStateLabel');
    const orbCore = document.getElementById('orbCore');
    const orbRing = document.getElementById('orbRing');
    const micIcon = document.getElementById('micIcon');
    const vuMeter = document.getElementById('vuMeter');
    const transcriptBox = document.getElementById('transcriptBox');
    const muteBtn = document.getElementById('muteBtn');
    const interruptBtn = document.getElementById('interruptBtn');

    // Auto-connect on page load to local bridge
    window.addEventListener('DOMContentLoaded', () => {
      startVoiceSession();
    });

    async function startVoiceSession() {
      connStatus.textContent = 'CONNECTING TO BRIDGE...';
      connStatus.className = 'text-amber-400 font-mono';

      const uri = `ws://localhost:8090`;

      try {
        ws = new WebSocket(uri);

        ws.onopen = async () => {
          console.log("WebSocket open to local bridge");
        };

        ws.onmessage = async (event) => {
          let data;
          if (event.data instanceof Blob) {
            data = JSON.parse(await event.data.text());
          } else {
            data = JSON.parse(event.data);
          }

          if (data.setupComplete) {
            isConnected = true;
            connStatus.textContent = 'LIVE 2.5 DUPLEX';
            connStatus.className = 'text-emerald-400 font-bold';
            orbStateLabel.textContent = 'LISTENING';
            await initWebAudio();
          }

          if (data.serverContent) {
            const sc = data.serverContent;
            if (sc.interrupted) {
              appendLog('⚡ [Interrupted]', 'text-rose-400 font-bold');
            }
            if (sc.modelTurn && sc.modelTurn.parts) {
              for (const part of sc.modelTurn.parts) {
                if (part.inlineData && part.inlineData.data) {
                  orbStateLabel.textContent = 'SPEAKING';
                  orbCore.classList.add('border-cyan-400', 'scale-105');
                  micIcon.classList.add('text-cyan-400');
                  playAudioChunk(part.inlineData.data);
                } else if (part.text) {
                  appendLog(`AI: ${part.text}`, 'text-zinc-200');
                }
              }
            }
            if (sc.turnComplete) {
              orbStateLabel.textContent = 'LISTENING';
              orbCore.classList.remove('border-cyan-400', 'scale-105');
              micIcon.classList.remove('text-cyan-400');
            }
          }
        };

        ws.onerror = (err) => {
          console.error(err);
          connStatus.textContent = 'ERROR';
          connStatus.className = 'text-rose-400';
        };

        ws.onclose = () => {
          connStatus.textContent = 'DISCONNECTED';
          connStatus.className = 'text-zinc-500';
        };

      } catch (err) {
        alert('Failed to connect: ' + err.message);
      }
    }

    async function initWebAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: 16000,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      const source = audioContext.createMediaStreamSource(mediaStream);
      micProcessor = audioContext.createScriptProcessor(4096, 1, 1);

      source.connect(micProcessor);
      micProcessor.connect(audioContext.destination);

      micProcessor.onaudioprocess = (e) => {
        if (isMuted || !isConnected || ws.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);

        // VU Meter calculation
        let sum = 0;
        for (let i = 0; i < inputData.length; i++) sum += inputData[i] * inputData[i];
        const rms = Math.sqrt(sum / inputData.length);
        vuMeter.style.width = Math.min(100, rms * 400) + '%';

        // Convert Float32 to 16-bit PCM
        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          const s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        const base64Audio = btoa(String.fromCharCode.apply(null, new Uint8Array(pcm16.buffer)));
        ws.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Audio }]
          }
        }));
      };
    }

    let nextPlayTime = 0;
    function playAudioChunk(base64Data) {
      if (!audioContext) return;
      const binaryString = atob(base64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

      const int16Array = new Int16Array(bytes.buffer);
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      // 💎 CRITICAL FIX: Gemini 2.5 Live outputs crystal-clear 24,000 Hz (24kHz) PCM!
      // (Playing 24kHz audio at 16kHz caused the slow, robotic, distorted sound)
      const audioBuffer = audioContext.createBuffer(1, float32Array.length, 24000);
      audioBuffer.getChannelData(0).set(float32Array);

      const sourceNode = audioContext.createBufferSource();
      sourceNode.buffer = audioBuffer;
      sourceNode.connect(audioContext.destination);

      const currentTime = audioContext.currentTime;
      // Add a tiny 20ms jitter cushion for seamless buffer stitching
      if (nextPlayTime < currentTime) nextPlayTime = currentTime + 0.02;
      sourceNode.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;
    }

    function appendLog(msg, colorClass = 'text-zinc-400') {
      const div = document.createElement('div');
      div.className = colorClass;
      div.textContent = msg;
      transcriptBox.appendChild(div);
      transcriptBox.scrollTop = transcriptBox.scrollHeight;
    }

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? '🎤 Mic: MUTED' : '🎤 Mic: ON';
      muteBtn.className = isMuted
        ? 'px-4 py-2 rounded-lg bg-rose-950 border border-rose-800 text-xs font-mono text-rose-300 transition'
        : 'px-4 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-xs font-mono text-zinc-300 transition';
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        appendLog('⚡ [Manual Interruption triggered]', 'text-cyan-400');
        if (audioContext) nextPlayTime = audioContext.currentTime; // Drop speaker queue
      }
    });
  </script>
</body>
</html>
