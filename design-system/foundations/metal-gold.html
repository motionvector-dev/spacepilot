<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metal &middot; Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap">
<style>
:root{
  --root:#000;--ground:#050506;--panel:#0a0a0c;--card:#141417;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);
  --ink:#e4e4e7;--ink3:#71717a;
  --gold-1:#8a6a22;--gold-2:#c9a227;--gold-3:#f6e6a8;--gold-4:#fffbe8;
  --mono:'Geist Mono','JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;--sans:'Geist','Inter',-apple-system,sans-serif;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --root:#fbfaf8;--ground:#f5f4f1;--panel:#fff;--card:#fff;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.13);
  --ink:#1c1c1f;--ink3:#71717a;
  --gold-1:#37290e;--gold-2:#67511b;--gold-3:#9a7e32;--gold-4:#c9ab5a;
}}
:root[data-theme="light"]{
  --root:#fbfaf8;--ground:#f5f4f1;--panel:#fff;--card:#fff;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.13);
  --ink:#1c1c1f;--ink3:#71717a;
  --gold-1:#37290e;--gold-2:#67511b;--gold-3:#9a7e32;--gold-4:#c9ab5a;
}
:root[data-theme="dark"]{
  --root:#000;--ground:#050506;--panel:#0a0a0c;--card:#141417;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);
  --ink:#e4e4e7;--ink3:#71717a;
  --gold-1:#8a6a22;--gold-2:#c9a227;--gold-3:#f6e6a8;--gold-4:#fffbe8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);padding:28px}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
.metal-gold{background:linear-gradient(100deg,var(--gold-1),var(--gold-2),var(--gold-3),var(--gold-4),var(--gold-2));
  background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sample{font-weight:800;font-size:44px;letter-spacing:-.01em}
.swatchrow{display:flex;gap:6px;margin-top:22px}
.swatchrow i{flex:1;height:36px;border-radius:6px;border:1px solid var(--line)}
.hex{font-family:var(--mono);font-size:10px;color:var(--ink3);display:flex;gap:6px;margin-top:6px}
.hex span{flex:1;text-align:center}
</style>
</head>
<body>
  <div class="lbl">Metal &middot; gold &middot; 5-stop alloy ramp</div>
  <div class="sample metal-gold">SpacePilot</div>
  <div class="swatchrow">
    <i style="background:#2e1f08"></i><i style="background:#8a6a22"></i><i style="background:#c9a227"></i><i style="background:#f6e6a8"></i><i style="background:#fffbe8"></i>
  </div>
  <div class="hex"><span>#2e1f08</span><span>#8a6a22</span><span>#c9a227</span><span>#f6e6a8</span><span>#fffbe8</span></div>
</body>
</html>
