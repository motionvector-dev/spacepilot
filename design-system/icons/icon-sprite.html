<!-- @dsCard group="Icons" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon sprite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap">
<style>
:root{
  --root:#000000; --ground:#09090b; --panel:#111114; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#fafafa; --ink2:#a1a1aa; --ink4:#52525b;
  --mono:'Geist Mono','JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
  --sans:'Geist','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --r2:10px;
}
:root[data-theme="light"]{
  --root:#fdfdfc; --ground:#f7f7f5; --panel:#f2f2ef; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
  --ink:#09090b; --ink2:#52525b; --ink4:#a1a1aa;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --root:#000000; --ground:#09090b; --panel:#111114; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#fafafa; --ink2:#a1a1aa; --ink4:#52525b;
}}
:root[data-theme="dark"]{
  --root:#000000; --ground:#09090b; --panel:#111114; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#fafafa; --ink2:#a1a1aa; --ink4:#52525b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--root);color:var(--ink);font-family:var(--sans);font-size:13px;padding:20px}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink4);margin-bottom:12px}
.icn{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.specgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.iconcell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;
  border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);color:var(--ink2)}
.iconcell span{font-family:var(--mono);font-size:9px;color:var(--ink4);letter-spacing:.02em}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-ship" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M2 19h20"/></symbol>
<symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></symbol>
<symbol id="i-memory" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M8 6v12M12 6v12M16 6v12"/></symbol>
<symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="12" cy="12" r="3.5"/></symbol>
<symbol id="i-cargo" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/></symbol>
<symbol id="i-slot" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1.5" stroke-dasharray="3 2.6"/></symbol>
<symbol id="i-runtime" viewBox="0 0 24 24"><path d="M12 3 21 7.5v9L12 21 3 16.5v-9z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10.5 12 15.5l5-5M4 20h16"/></symbol>
<symbol id="i-install" viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="10" rx="1.5"/><path d="M12 3v9M8.5 8.5 12 12l3.5-3.5"/></symbol>
<symbol id="i-measure" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1"/><path d="M7 8v3M11 8v4.5M15 8v3M19 8v4.5"/></symbol>
<symbol id="i-flight" viewBox="0 0 24 24"><path d="M3 12h3l2.5-6L12 19l2.5-7 1.5 3H21"/></symbol>
<symbol id="i-dock" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><circle cx="7" cy="8" r=".85" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r=".85" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-meter" viewBox="0 0 24 24"><path d="M3.5 18a8.5 8.5 0 0 1 17 0"/><path d="M12 18 16.5 10.5"/></symbol>
<symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M7 9.5 10 12.5 7 15.5M13 15.5h4"/></symbol>
<symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 4 21.5 20.5h-19z"/><path d="M12 10.5v4.5"/><circle cx="12" cy="17.8" r=".85" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-verified" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.2 10.8 15 16 9.8"/></symbol>
<symbol id="i-unflown" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke-dasharray="2.4 3"/></symbol>
<symbol id="i-agent" viewBox="0 0 24 24"><path d="M12 3 14.4 9.6 21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z"/></symbol>
<symbol id="i-quota" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="1"/><path d="M15.5 6v12"/></symbol>
<symbol id="i-shell" viewBox="0 0 24 24"><circle cx="7.5" cy="12" r="3.5"/><path d="M11 12h10M18 12v3M15 12v2.2"/></symbol>
<symbol id="i-probe" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8 20.5 20.5"/></symbol>
<symbol id="i-licence" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
<symbol id="i-threshold" viewBox="0 0 24 24"><path d="M4 21V7a8 8 0 0 1 16 0v14"/><path d="M9.5 21v-7h5v7"/></symbol>
<symbol id="i-refusal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M6.4 6.4 17.6 17.6"/></symbol>
<symbol id="i-system" viewBox="0 0 24 24"><rect x="3" y="3" width="11" height="11" rx="1.5"/><rect x="10" y="10" width="11" height="11" rx="1.5"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="8.5" r="4"/><path d="M10.4 11.4 20 21M17 18l2-2M14 15l2-2"/></symbol>
</defs></svg>
<div class="lbl">Icons &middot; 27 on one construction &middot; 24px grid &middot; 1.5px stroke &middot; square caps &middot; miter joins</div>
<div class="specgrid">
  <div class="iconcell"><svg class="icn"><use href="#i-ship"></use></svg><span>ship</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-chip"></use></svg><span>chip</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-memory"></use></svg><span>memory</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-disk"></use></svg><span>disk</span></div>

  <div class="iconcell"><svg class="icn"><use href="#i-measure"></use></svg><span>measure</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-flight"></use></svg><span>flight</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-dock"></use></svg><span>dock</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-meter"></use></svg><span>meter</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-terminal"></use></svg><span>terminal</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-warning"></use></svg><span>warning</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-verified"></use></svg><span>verified</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-unflown"></use></svg><span>unflown</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-agent"></use></svg><span>agent</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-quota"></use></svg><span>quota</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-shell"></use></svg><span>shell</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-probe"></use></svg><span>probe</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-licence"></use></svg><span>licence</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-threshold"></use></svg><span>threshold</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-refusal"></use></svg><span>refusal</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-system"></use></svg><span>system</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-settings"></use></svg><span>settings</span></div>
  <div class="iconcell"><svg class="icn"><use href="#i-key"></use></svg><span>key</span></div>
</div>
</body>
</html>
