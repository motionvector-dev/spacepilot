<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpacePilot Cockpit — Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap">
<style>
/* ═══ tokens, lifted from web/app.css ═══════════════════════════════ */
:root{
  --root:#000000; --ground:#09090b; --panel:#111114; --card:#18181b; --raised:#222226;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --line3:rgba(255,255,255,.22);
  --ink:#fafafa; --ink2:#a1a1aa; --ink3:#71717a; --ink4:#52525b;
  --true:#10b981; --wrong:#f43535; --agent:#a49bd0;
  --silver:#cfd4dc; --silver-line:rgba(207,212,220,.30);
  --gold:#c9a227; --gold-line:rgba(201,162,39,.40);
  --invbg:#fafafa; --invink:#09090b;
  --mono:'Geist Mono','JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
  --sans:'Geist','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --r1:6px; --r2:10px; --r3:14px;
}
:root[data-theme="light"]{
  --root:#fdfdfc; --ground:#f7f7f5; --panel:#f2f2ef; --card:#ffffff; --raised:#e6e6e1;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14); --line3:rgba(0,0,0,.22);
  --ink:#09090b; --ink2:#52525b; --ink3:#71717a; --ink4:#a1a1aa;
  --true:#059669; --wrong:#e11d48; --agent:#5b528f;
  --silver:#5c6672; --silver-line:rgba(92,102,114,.32);
  --gold:#8a6a22; --gold-line:rgba(138,106,34,.34);
  --invbg:#09090b; --invink:#fafafa;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--root);color:var(--ink);font-family:var(--sans);font-size:13px;
  -webkit-font-smoothing:antialiased;overflow:hidden}
.m{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink4)}
button{font-family:inherit;background:transparent;border:0;color:inherit;cursor:pointer}
input,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ═══ grain — true black is never mathematically flat ═══════════════ */
.grain{position:relative}
.grain::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  opacity:var(--grain-a,.5);mix-blend-mode:overlay;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.42'/></svg>")}

/* ═══ app shell ════════════════════════════════════════════════════ */
#app{display:grid;grid-template-columns:var(--rail,236px) 1fr 316px;grid-template-rows:auto 1fr;height:100%;
  transition:grid-template-columns var(--mo-route,200ms) var(--ease-out,ease)}
html[data-rail="collapsed"]{--rail:62px}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:10px 18px;border-bottom:1px solid var(--line);background:var(--ground);z-index:3}
.hgroup{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--r1)}
.seg button{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  padding:5px 9px;border-radius:4px;color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--invbg);color:var(--invink)}

nav#tree{border-right:1px solid var(--line);background:var(--ground);overflow-y:auto;overflow-x:hidden;padding:8px 8px 32px}
.railtop{display:flex;justify-content:flex-end;padding:2px 2px 8px}
.railtop button{display:flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:var(--r1);color:var(--ink4)}
.railtop button:hover{background:var(--card);color:var(--ink2)}
.railtop svg{transition:transform var(--mo-route,200ms) var(--ease-out,ease)}
html[data-rail="collapsed"] .railtop{justify-content:center}
html[data-rail="collapsed"] .railtop svg{transform:rotate(180deg)}
.glabel,.tnode .tlabel{transition:opacity var(--mo-exit,120ms) var(--ease-out,ease)}
html[data-rail="collapsed"] .glabel,html[data-rail="collapsed"] .tnode .tlabel{opacity:0;pointer-events:none}
html[data-rail="collapsed"] .thead{padding:10px 0 4px;justify-content:center}
html[data-rail="collapsed"] .tnode{display:none}
html[data-rail="collapsed"] .gicon{width:38px;height:38px;border-radius:var(--r2)}
html[data-rail="collapsed"] .gicon.on{background:var(--card);color:var(--ink)}
.tgroup{margin:0 0 4px}
.thead{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink4);padding:12px 6px 6px;width:100%;text-align:left}
.gicon{display:flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;
  color:var(--ink3);transition:color var(--mo-exit,120ms) var(--ease-out,ease)}
.thead:hover .gicon{color:var(--ink)}
.gicon.on{color:var(--ink)}
.tnode{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  font-family:var(--mono);font-size:11px;color:var(--ink3);padding:6px 10px;border-radius:var(--r1)}
.tnode:hover{background:var(--card);color:var(--ink2)}
.tnode[aria-current="true"]{background:var(--card);color:var(--ink)}
.tnode .dot{width:4px;height:4px;border-radius:50%;background:transparent;flex:none}
.tnode[data-threshold="1"] .dot{background:var(--gold)}
.pt-rail{width:2px;border-radius:2px;align-self:stretch;
  background:linear-gradient(180deg,#171b21 0%,#7c838f 22%,#ffffff 46%,#a7b0bc 64%,#3b434e 88%,#171b21 100%)}

main#stage{overflow:auto;background:var(--root);display:flex;flex-direction:column}
.stagebar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 20px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--root);z-index:2}
.viewport{padding:24px 28px 60px;flex:1}

aside#panel{border-left:1px solid var(--line);background:var(--ground);overflow-y:auto;padding:0 0 40px}
.psec{border-bottom:1px solid var(--line);padding:14px 16px}
.psec > .lbl{display:block;margin-bottom:11px}
.ctl{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;margin-bottom:9px}
.ctl label{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.ctl input[type=range]{width:100%;accent-color:var(--ink2);height:16px}
.ctl output{font-family:var(--mono);font-size:10px;color:var(--ink2);text-align:right}
.ctl.wide{grid-template-columns:1fr}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
.tog span{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.sw{width:32px;height:18px;border-radius:9px;border:1px solid var(--line2);background:var(--card);
  position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:var(--ink4);transition:transform .16s ease,background .16s ease}
.sw[aria-checked="true"]{border-color:var(--line3)}
.sw[aria-checked="true"]::after{transform:translateX(14px);background:var(--ink)}
.swatchrow{display:flex;gap:5px;margin-top:6px}
.swatchrow i{flex:1;height:22px;border-radius:4px;border:1px solid var(--line)}

/* ═══ surfaces ═════════════════════════════════════════════════════ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2)}
.sect{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.row{display:grid;align-items:center;column-gap:16px;padding:11px 16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:12px}
.row:first-child{border-top:0}
.k{font-family:var(--mono);font-size:12px}
.dim{color:var(--ink3)} .dim2{color:var(--ink4)} .mid{color:var(--ink2)}
.ok{color:var(--true)} .no{color:var(--wrong)}
.chip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:5px;
  border:1px solid var(--line);color:var(--ink2);background:var(--card);white-space:nowrap}
.chip.tight{color:var(--silver);background:var(--raised);border-color:var(--silver-line);letter-spacing:.02em}
.chip.no{color:var(--wrong);background:transparent;border-color:transparent;padding-left:0}
.slots{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.slot{flex:0 1 158px;min-width:118px;height:26px;border:1px dashed var(--line3);border-radius:var(--r1);
  display:flex;align-items:center;padding:0 9px;overflow:hidden;
  font-family:var(--mono);font-size:10px;color:var(--ink4)}
.slot.full{border:1px solid var(--line3);background:var(--card);border-style:solid;color:var(--ink2)}
.slot .lab{position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.au-edge{height:2px;background:linear-gradient(96deg,#2e1f08 0%,#8a6a22 12%,#c9a227 26%,#fffbe8 40%,#d8b95a 54%,#4a3410 68%,#f6e6a8 84%,#3d2b0d 100%)}
.prov{font-family:var(--mono);font-size:10px;letter-spacing:.02em}
.prov.measured{color:var(--true)} .prov.declared{color:var(--ink2)}
.prov.estimated{color:var(--ink3)}
.note{font-size:11.5px;line-height:1.6;color:var(--ink3);max-width:80ch}
.meter{height:4px;border-radius:2px;background:var(--card);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink2)}
.bezelwrap{position:relative;width:112px;height:112px;flex:none}
.bezelwrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:30px}
.bezelwrap .core{position:absolute;inset:7px;border-radius:24px;background:var(--root);
  display:flex;align-items:center;justify-content:center}
.hidden{display:none!important}

/* ═══ motion grammar ═══════════════════════════════════════════════
   exits are faster than entrances and travel nowhere · stagger 40ms,
   capped at the fifth sibling · reduced motion zeroes distance and
   keeps time · numbers never tick, they crossfade.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --mo-travel:4px;
  --mo-enter:180ms; --mo-exit:120ms; --mo-cross:240ms; --mo-fill:220ms; --mo-route:200ms;
  --mo-stagger:40ms;
  --ease-out:cubic-bezier(.22,.68,.28,1);
  --ease-in-out:cubic-bezier(.5,0,.3,1);
}
html[data-motion="reduced"]{--mo-travel:0px}   /* distance to zero, time unchanged */

@keyframes mo-rise{from{opacity:0;transform:translateY(var(--mo-travel))}to{opacity:1;transform:none}}
@keyframes mo-in{from{opacity:0}to{opacity:1}}
@keyframes mo-out{from{opacity:1}to{opacity:0}}
@keyframes mo-fill{from{opacity:0}to{opacity:1}}
@keyframes mo-sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.mo-rise{animation:mo-rise var(--mo-enter) var(--ease-out) both}
.mo-in{animation:mo-in var(--mo-enter) var(--ease-out) both}
.mo-out{animation:mo-out var(--mo-exit) var(--ease-out) both}
.mo-cross{animation:mo-in var(--mo-cross) var(--ease-in-out) both}
/* stagger caps at the fifth sibling — a sixth row waits no longer than a fifth */
.mo-stag > *:nth-child(1){animation-delay:0ms}
.mo-stag > *:nth-child(2){animation-delay:calc(var(--mo-stagger)*1)}
.mo-stag > *:nth-child(3){animation-delay:calc(var(--mo-stagger)*2)}
.mo-stag > *:nth-child(4){animation-delay:calc(var(--mo-stagger)*3)}
.mo-stag > *:nth-child(n+5){animation-delay:calc(var(--mo-stagger)*4)}
#viewport.routing{animation:mo-in var(--mo-route) var(--ease-out) both}

/* the cargo-slot fill: border-style cannot animate, so the solid ring is a
   second layer that fades over the dashed one. Nothing travels. */
.slot{position:relative}
.slot .solid{position:absolute;inset:-1px;border:1px solid var(--line3);border-radius:var(--r1);
  background:var(--card);opacity:0}
.slot.full .solid{opacity:1}
.slot.filling .solid{animation:mo-fill var(--mo-fill) var(--ease-out) both}

/* the first-flight crossfade — the figure replaces the mark in place */
.xfade{display:inline-grid}
.xfade > *{grid-area:1/1}
.xfade .was{opacity:0}
.xfade.playing .was{animation:mo-out var(--mo-cross) var(--ease-in-out) both}
.xfade.playing .now{animation:mo-in var(--mo-cross) var(--ease-in-out) both}

/* ═══ components ═══════════════════════════════════════════════════ */
.btn,.btn2,.btn3,.btn-danger{font-family:var(--mono);font-size:12px;padding:9px 18px;border-radius:var(--r1);
  border:1px solid transparent;transition:background var(--mo-exit) var(--ease-out),
  border-color var(--mo-exit) var(--ease-out),color var(--mo-exit) var(--ease-out);white-space:nowrap}
.btn{background:var(--invbg);color:var(--invink)}
.btn:hover,.btn.is-hover{background:var(--ink);}
.btn:active,.btn.is-active{transform:none;background:var(--ink2)}
.btn2{background:var(--card);color:var(--ink);border-color:var(--line2)}
.btn2:hover,.btn2.is-hover{background:var(--raised);border-color:var(--line3)}
.btn2:active,.btn2.is-active{background:var(--panel)}
.btn3{background:transparent;color:var(--ink3);padding-left:6px;padding-right:6px}
.btn3:hover,.btn3.is-hover{color:var(--ink)}
.btn-danger{background:transparent;color:var(--wrong);border-color:var(--wrong)}
.btn-danger:hover,.btn-danger.is-hover{background:var(--wrong);color:var(--root)}
.btn[disabled],.btn2[disabled],.btn3[disabled],.is-disabled{opacity:.34;pointer-events:none}
.btn:focus-visible,.btn2:focus-visible,.btn3:focus-visible,.btn-danger:focus-visible,
.is-focus{outline:2px solid var(--ink);outline-offset:2px}

.icn{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.icn.lg{width:24px;height:24px}
.icn.xl{width:30px;height:30px}
.iconcell{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px;
  border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);color:var(--ink2)}
.iconcell span{font-family:var(--mono);font-size:9.5px;color:var(--ink4);letter-spacing:.02em}
.iconcell:hover{color:var(--ink);border-color:var(--line2)}
.specgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.states{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.statecell{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.statecell > .lbl{font-size:9.5px}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line2);
  border-radius:var(--r2);background:var(--card);font-family:var(--mono);font-size:11.5px}
.modalbox{border:1px solid var(--line2);border-radius:var(--r3);background:var(--panel);
  max-width:440px;overflow:hidden}
.skel{background:linear-gradient(90deg,var(--card),var(--raised),var(--card));
  background-size:200% 100%;border-radius:4px;height:11px}
html[data-motion="full"] .skel{animation:skel 1.4s linear infinite}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
.spec-row{display:grid;grid-template-columns:170px 96px 130px 1fr 78px;gap:14px;align-items:center;
  padding:12px 16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px}
.stage-demo{border:1px solid var(--line);border-radius:var(--r2);background:var(--root);
  padding:18px 20px;min-height:78px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}

html.bare #tree, html.bare #panel, html.bare .stagebar, html.bare header{display:none}
html.bare .rv, html.bare .mo-rise, html.bare .probe-line{opacity:1!important;transform:none!important;animation:none!important}
html.bare #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
html.bare .viewport{padding:44px 56px 56px;max-width:1080px;margin:0 auto;width:100%}
@media (max-width:1300px){
  #app{grid-template-columns:212px 1fr;grid-template-rows:auto 1fr auto}
  aside#panel{grid-column:1/-1;grid-row:3;border-left:0;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));align-content:start;max-height:46vh}
}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  nav#tree{grid-row:2;max-height:168px;border-right:0;border-bottom:1px solid var(--line)}
  main#stage{grid-row:3}
  header{flex-wrap:wrap;gap:10px}
  .viewport{padding:16px 14px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

/* ═══════════════════════════════════════════════════════════════════
   METAL — a light model, not a colour.
     base is dark · anisotropic specular reaching near-white ·
     wavelength-split IOR at the silhouette · grain in the same pass.
   Tier 1 is WebGPU/WGSL, tier 2 is WebGL2/GLSL, and the two run the
   same maths. Whichever boots is reported in the header.
   ═══════════════════════════════════════════════════════════════════ */

const ALLOYS = {
  gold:   [[0.180,0.122,0.031],[0.541,0.416,0.133],[0.788,0.635,0.153],[0.965,0.902,0.659],[1.000,0.984,0.910]],

  nacre:  [[0.984,0.965,0.925],[0.957,0.890,0.933],[0.925,0.906,0.949],[0.894,0.941,0.918],[0.902,0.929,0.957]]
};

const SHARED_GLSL = `
float sdr(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return min(max(q.x,q.y),0.0) + length(max(q,0.0)) - r; }
float hash21(vec2 p){ p = fract(p*vec2(123.34,345.45)); p += dot(p, p+34.345); return fract(p.x*p.y); }
vec3 ramp(float t, vec3 c0, vec3 c1, vec3 c2, vec3 c3, vec3 c4){
  t = clamp(t, 0.0, 1.0) * 4.0;
  if (t < 1.0) return mix(c0, c1, t);
  if (t < 2.0) return mix(c1, c2, t-1.0);
  if (t < 3.0) return mix(c2, c3, t-2.0);
  return mix(c3, c4, t-3.0);
}
float envAt(float a, float lobes, float sharp){
  float best = 0.0;
  for (int i = 0; i < 6; i++){
    if (float(i) >= lobes) break;
    float o = a - float(i) * 6.2831853 / lobes;
    best = max(best, pow(max(0.0, cos(o)), sharp));
  }
  float base = 0.5 + 0.5 * cos(a * lobes);
  return clamp(mix(base * 0.30, 1.0, best), 0.0, 1.0);
}`;

const FRAG_GLSL = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uRadius, uThick, uEnvRot, uLobes, uRough, uDisp, uGrain, uTime;
uniform vec3 uC0, uC1, uC2, uC3, uC4;
out vec4 fragColor;
${SHARED_GLSL}
void main(){
  vec2 p = gl_FragCoord.xy - 0.5 * uRes;
  vec2 b = 0.5 * uRes - vec2(1.5);
  float r  = uRadius;
  float d  = sdr(p, b - vec2(uThick * 0.5), r);
  float ring = abs(d) - uThick * 0.5;
  float a = 1.0 - smoothstep(-0.9, 0.9, ring);
  if (a <= 0.001) { fragColor = vec4(0.0); return; }

  float e = 1.0;
  vec2 grad = normalize(vec2(
    sdr(p + vec2(e,0.0), b - vec2(uThick*0.5), r) - sdr(p - vec2(e,0.0), b - vec2(uThick*0.5), r),
    sdr(p + vec2(0.0,e), b - vec2(uThick*0.5), r) - sdr(p - vec2(0.0,e), b - vec2(uThick*0.5), r)) + 1e-6);
  float ang = atan(grad.y, grad.x) + uEnvRot;

  float sharp = mix(48.0, 3.0, clamp(uRough, 0.0, 1.0));
  // curvature rises at the corners, and dispersion follows curvature
  float corner = smoothstep(0.0, 1.0, length(max(abs(p) - (b - vec2(r)), 0.0)) / max(r, 1.0));
  float band = clamp(uThick / max(uRes.x, 1.0) * 7.0, 0.25, 1.0);
  float o = uDisp * band * (0.05 + 0.22 * corner);

  float eR = envAt(ang + o, uLobes, sharp);
  float eG = envAt(ang,     uLobes, sharp);
  float eB = envAt(ang - o, uLobes, sharp);
  vec3 col = vec3(
    ramp(eR, uC0,uC1,uC2,uC3,uC4).r,
    ramp(eG, uC0,uC1,uC2,uC3,uC4).g,
    ramp(eB, uC0,uC1,uC2,uC3,uC4).b);

  float n = hash21(gl_FragCoord.xy + floor(uTime * 24.0) * 0.017) - 0.5;
  col += n * uGrain * 0.14;
  fragColor = vec4(clamp(col, 0.0, 1.0), a);
}`;

const VERT_GLSL = `#version 300 es
void main(){ vec2 v[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0)); gl_Position = vec4(v[gl_VertexID], 0.0, 1.0); }`;

/* The tier-1 source. Same maths, WGSL. Shown in the panel so it can be lifted. */
const WGSL = `struct U { res:vec2f, radius:f32, thick:f32, envRot:f32, lobes:f32, rough:f32, disp:f32,
  grain:f32, time:f32, _p:vec2f, c0:vec4f, c1:vec4f, c2:vec4f, c3:vec4f, c4:vec4f };
@group(0) @binding(0) var<uniform> u: U;

fn sdr(p:vec2f, b:vec2f, r:f32) -> f32 { let q = abs(p) - b + r; return min(max(q.x,q.y),0.0) + length(max(q,vec2f(0.0))) - r; }
fn hash21(p0:vec2f) -> f32 { var p = fract(p0*vec2f(123.34,345.45)); p += vec2f(dot(p,p+34.345)); return fract(p.x*p.y); }
fn ramp(t0:f32) -> vec3f {
  let t = clamp(t0,0.0,1.0)*4.0;
  if (t < 1.0) { return mix(u.c0.rgb, u.c1.rgb, t); }
  if (t < 2.0) { return mix(u.c1.rgb, u.c2.rgb, t-1.0); }
  if (t < 3.0) { return mix(u.c2.rgb, u.c3.rgb, t-2.0); }
  return mix(u.c3.rgb, u.c4.rgb, t-3.0);
}
fn envAt(a:f32, sharp:f32) -> f32 {
  var best = 0.0;
  for (var i = 0; i < 6; i++) {
    if (f32(i) >= u.lobes) { break; }
    let o = a - f32(i) * 6.2831853 / u.lobes;
    best = max(best, pow(max(0.0, cos(o)), sharp));
  }
  let base = 0.5 + 0.5 * cos(a * u.lobes);
  return clamp(mix(base * 0.30, 1.0, best), 0.0, 1.0);
}
@vertex fn vs(@builtin(vertex_index) i:u32) -> @builtin(position) vec4f {
  var v = array<vec2f,3>(vec2f(-1.0,-1.0), vec2f(3.0,-1.0), vec2f(-1.0,3.0));
  return vec4f(v[i], 0.0, 1.0);
}
@fragment fn fs(@builtin(position) fc:vec4f) -> @location(0) vec4f {
  let p = vec2f(fc.x, u.res.y - fc.y) - 0.5 * u.res;
  let b = 0.5 * u.res - vec2f(1.5);
  let bb = b - vec2f(u.thick * 0.5);
  let d = sdr(p, bb, u.radius);
  let ring = abs(d) - u.thick * 0.5;
  let a = 1.0 - smoothstep(-0.9, 0.9, ring);
  if (a <= 0.001) { return vec4f(0.0); }
  let e = 1.0;
  let grad = normalize(vec2f(
    sdr(p + vec2f(e,0.0), bb, u.radius) - sdr(p - vec2f(e,0.0), bb, u.radius),
    sdr(p + vec2f(0.0,e), bb, u.radius) - sdr(p - vec2f(0.0,e), bb, u.radius)) + vec2f(1e-6));
  let ang = atan2(grad.y, grad.x) + u.envRot;
  let sharp = mix(48.0, 3.0, clamp(u.rough, 0.0, 1.0));
  let corner = smoothstep(0.0, 1.0, length(max(abs(p) - (b - vec2f(u.radius)), vec2f(0.0))) / max(u.radius, 1.0));
  let band = clamp(u.thick / max(u.res.x, 1.0) * 7.0, 0.25, 1.0);
  let o = u.disp * band * (0.05 + 0.22 * corner);
  let col0 = vec3f(ramp(envAt(ang + o, sharp)).r, ramp(envAt(ang, sharp)).g, ramp(envAt(ang - o, sharp)).b);
  let n = hash21(fc.xy + floor(u.time * 24.0) * 0.017) - 0.5;
  return vec4f(clamp(col0 + vec3f(n * u.grain * 0.14), vec3f(0.0), vec3f(1.0)), a);
}`;

let RENDERER = "none";

class MetalSurface {
  constructor(canvas, alloy) {
    this.c = canvas; this.alloy = alloy || "gold"; this.ok = false;
    const gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: false, antialias: false });
    if (!gl) return;
    this.gl = gl;
    const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; } return s; };
    const vs = sh(gl.VERTEX_SHADER, VERT_GLSL), fs = sh(gl.FRAGMENT_SHADER, FRAG_GLSL);
    if (!vs || !fs) return;
    const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return; }
    this.p = p; gl.useProgram(p);
    this.u = {};
    for (const n of ["uRes","uRadius","uThick","uEnvRot","uLobes","uRough","uDisp","uGrain","uTime","uC0","uC1","uC2","uC3","uC4"])
      this.u[n] = gl.getUniformLocation(p, n);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    this.ok = true; if (RENDERER === "none") RENDERER = "WebGL2 · GLSL";
  }
  draw(o) {
    if (!this.ok) return;
    const gl = this.gl, dpr = Math.min(devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(this.c.clientWidth * dpr)), h = Math.max(1, Math.round(this.c.clientHeight * dpr));
    if (this.c.width !== w || this.c.height !== h) { this.c.width = w; this.c.height = h; }
    gl.viewport(0, 0, w, h); gl.useProgram(this.p);
    gl.uniform2f(this.u.uRes, w, h);
    gl.uniform1f(this.u.uRadius, o.radius * dpr);
    gl.uniform1f(this.u.uThick,  o.thick  * dpr);
    gl.uniform1f(this.u.uEnvRot, o.envRot);
    gl.uniform1f(this.u.uLobes,  o.lobes);
    gl.uniform1f(this.u.uRough,  o.rough);
    gl.uniform1f(this.u.uDisp,   o.disp);
    gl.uniform1f(this.u.uGrain,  o.grain);
    gl.uniform1f(this.u.uTime,   o.time);
    const c = ALLOYS[o.alloy] || ALLOYS.gold;
    gl.uniform3fv(this.u.uC0, c[0]); gl.uniform3fv(this.u.uC1, c[1]); gl.uniform3fv(this.u.uC2, c[2]);
    gl.uniform3fv(this.u.uC3, c[3]); gl.uniform3fv(this.u.uC4, c[4]);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}

/* ═══ the rules, applied — not hardcoded verdicts ══════════════════ */
function verdict(m) {
  const ratio = m.ws / SHIP.usable_bytes;
  if (ratio > 1) return { k:"no", label:"won't fit", ratio };
  if (ratio > RULES.tight_threshold) return { k:"tight", label:"fits, tight", ratio };
  return { k:"fits", label:"fits", ratio };
}
const unitOf = metric => metric === "realtime_factor" ? "× realtime" : " s per second of video";

/* Both streams are flown. The stream name rides on the number, never in a legend. */
function flownOf(id) {
  const solo = MEASURE.solo.find(x => x.model === id);
  if (solo) return { rec: solo, stream: "solo" };
  const loaded = MEASURE.loaded.find(x => x.model === id);
  return loaded ? { rec: loaded, stream: "loaded" } : null;
}
/* Cargo that cannot fit is never counted as unflown — it is a wall, not an invitation. */
function cargoCounts(ids) {
  const c = { flown:0, unflown:0, paper:0, blank:0, wont:0 };
  for (const id of ids) {
    const m = byId(id);
    if (verdict(m).k === "no") { c.wont++; continue; }
    if (flownOf(id)) { c.flown++; continue; }
    c.unflown++;
    if (m.speed) c.paper++; else c.blank++;
  }
  return c;
}
function speedCell(m) {
  if (verdict(m).k === "no") return `<span class="dim2">—</span>`;
  const f = flownOf(m.id);
  if (f) return `<span class="prov measured">flown</span> <span class="mid">${f.rec.value}${unitOf(f.rec.metric)} · ${f.stream}</span>`;
  if (!m.speed) return `<span class="prov estimated">unflown</span>`;
  return `<span class="mid" title="${esc(m.speed.note)}">${m.speed.value}${unitOf(m.speed.metric)} on paper</span>${sparse() ? "" : ` <span class="dim2" style="white-space:nowrap">· ${m.speed.on}</span>`} <span class="prov estimated" style="white-space:nowrap">· unflown</span>`;
}
function licenceCell(m) {
  if (m.restrictions.length) return `<span class="dim2" title="${esc(m.restrictions.join(' · '))}">${esc(m.restrictions[0])}</span>`;
  return `<span class="dim2">${m.spdx || "—"}</span>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

}

function cargoTable(ids, opts) {
  opts = opts || {};

/* One slot per piece of cargo actually on disk — no fixed capacity, because
   there isn't one. The arriving piece is always rendered last so the fill
   animation has a stable target. */
function slotRow(pending) {
  const ids = S.cargo.filter(id => id !== pending).concat(pending ? [pending] : []);
  const out = ids.map(id => {
    const m = byId(id);
    return `<div class="slot full"><div class="solid"></div><span class="lab" title="${esc(m.name)} · ${fmt(m.download_bytes)}">${esc(m.name)}</span></div>`;
  }).join("");
  return `<div class="slots">${out || `<div class="slot"><span class="lab">nothing on disk</span></div>`}</div>`;
}

/* ═══ panel ════════════════════════════════════════════════════════ */
function rangeCtl(key, label, min, max, step, val, unit) {
  return `<div class="ctl"><label>${label}</label><input type="range" data-metal-k="${key}" min="${min}" max="${max}" step="${step}" value="${val}">
    <output>${val}${unit || ""}</output></div>`;
}
function togCtl(scope, key, label, on) {
  return `<div class="tog"><span>${label}</span><div class="sw" role="switch" aria-checked="${on}" data-tog="${scope}.${key}"></div></div>`;
}

    ` + TREE.map(([grp, sub, nodes]) => {
      const active = S.route.startsWith(grp + "/");
      return `<div class="tgroup">
        <button class="thead" data-group="${grp}" title="${grp} — ${sub}">
          <span class="gicon ${active ? "on" : ""}">${icon(GROUP_ICON[grp] || "chip")}</span>
          <span class="glabel">${grp}${sparse() ? "" : ` · <span style="text-transform:none;letter-spacing:0">${sub}</span>`}</span>
        </button>
        ${nodes.map(([id, label, th]) => {
          const route = `${grp}/${id}`, cur = S.route === route;
          return `<button class="tnode" data-go="${route}" data-threshold="${th}" aria-current="${cur}">
            ${cur && S.alloc.navRail && S.metal.on ? `<span class="pt-rail"></span>` : `<span class="dot"></span>`}
            <span class="tlabel">${label}</span></button>`;
        }).join("")}</div>`;
    }).join("");
}

function render() {
  const root = document.documentElement;
  root.dataset.theme = S.theme === "system"
    ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : S.theme;
  root.style.setProperty("--grain-a", String(S.metal.grain * 0.9));
  root.dataset.motion = S.motion;
  root.dataset.rail = S.railCollapsed ? "collapsed" : "open";

  renderTree();
  $("#crumb").textContent = S.structure === "shipped" ? "cockpit · as shipped" : "/cockpit/" + S.route;
  $("#statecount").textContent = Object.keys(R).length + " states";
  $("#renderer-badge").textContent = S.metal.on ? (S.power === "low" ? "CSS tier 2" : RENDERER) : "metal off";
  $("#viewport").innerHTML = S.structure === "shipped" ? asShipped() : (R[S.route] || (() => "<div class='dim'>—</div>"))();
  $("#panel").innerHTML = panelHTML();

  if (S.motion !== "reduced" && !document.documentElement.classList.contains("bare")) restart($("#viewport"), "routing");
  const auto = AUTOPLAY[S.route];
  if (auto && !document.documentElement.classList.contains("bare")) requestAnimationFrame(() => play(auto));

  surfaces = [];
  if (S.power !== "low") {
    document.querySelectorAll("[data-metal] canvas").forEach(c => {
      const s = new MetalSurface(c, c.parentElement.dataset.metal);
      if (s.ok) surfaces.push([s, c.parentElement.dataset.metal]);
    });
  } else {
    document.querySelectorAll("[data-metal]").forEach(w => {
      const cs = ALLOYS[w.dataset.metal].map((c, i) => `rgb(${c.map(x => Math.round(x*255)).join(",")}) ${i*25}%`).join(",");
      w.style.background = `conic-gradient(from 18deg, ${cs}, rgb(${ALLOYS[w.dataset.metal][0].map(x=>Math.round(x*255)).join(",")}))`;
      w.style.borderRadius = S.metal.radius + "px";
      w.querySelector("canvas").style.display = "none";
    });
  }
}

/* ═══ the environment moves, the object stays put ══════════════════ */
let t0 = performance.now(), envRot = 0.35;
function frame(now) {
  const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
  if (S.motion !== "reduced") envRot += dt * S.metal.speed * 0.9;
  const o = Object.assign({}, S.metal, { envRot, time: now / 1000 });
  for (const [s, alloy] of surfaces) s.draw(Object.assign({}, o, { alloy }));
  requestAnimationFrame(frame);
}


/* ═══ motion runtime ═══════════════════════════════════════════════
   Every animation here is replayable, because a transition you cannot
   see twice cannot be judged. Reduced motion zeroes --mo-travel and
   leaves every duration alone — flip it and play the same row again.
   ═══════════════════════════════════════════════════════════════════ */
function restart(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function stagger(nodes, staggered) {
  nodes.forEach(n => { n.classList.remove("mo-rise", "mo-out"); });
  void document.body.offsetWidth;
  nodes.forEach((n, i) => {
    n.style.animationDelay = staggered ? Math.min(i, 4) * parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--mo-stagger")) + "ms" : "0ms";
    n.classList.add("mo-rise");
  });
}
function play(kind) {
  const demo = $("#mo-demo"), slot = $("#mo-slot"), xf = $("#mo-xfade");
  switch (kind) {
    case "rise":  if (demo) { demo.classList.remove("mo-stag"); stagger([...demo.children], false); } break;
    case "stag":  if (demo) { demo.classList.remove("mo-stag"); stagger([...demo.children], true); } break;
    case "exit":  if (demo) [...demo.children].forEach(c => restart(c, "mo-out")); break;
    case "cross": restart(xf, "playing"); break;
    case "fill":  if (slot) { slot.classList.remove("full"); restart(slot, "filling");
                    setTimeout(() => slot.classList.add("full"), 220); } break;
    case "route": restart($("#viewport"), "routing"); break;
    case "probe": stagger([...document.querySelectorAll("#probe-fields .probe-line")], true); break;
    case "arrival": {
      const b = $("#arrival-slots .slot:last-child");
      if (b) { b.classList.remove("full"); restart(b, "filling"); setTimeout(() => b.classList.add("full"), 220); }
      break; }
    case "firstflight": restart($("#ff-mark"), "playing"); restart($("#ff-figure"), "playing"); break;
  }
}
const AUTOPLAY = { "first-run/detect":"probe", "cargo/stowed":"arrival", "measurements/first-flight":"firstflight" };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-play]");
  if (b) play(b.dataset.play);
});

/* ═══ wiring ═══════════════════════════════════════════════════════ */
document.addEventListener("click", e => {
  if (e.target.closest("#railtoggle")) { S.railCollapsed = !S.railCollapsed; render(); return; }
  const grp = e.target.closest("[data-group]");
  if (grp) {
    // a collapsed rail opens on the way to the group you asked for
    const g = TREE.find(t => t[0] === grp.dataset.group);
    if (S.railCollapsed) S.railCollapsed = false;
    if (g) S.route = g[0] + "/" + g[2][0][0];
    render(); return;
  }
  const go = e.target.closest("[data-go]");
  if (go) {
    S.route = go.dataset.go;
    if (S.structure === "shipped") S.structure = "restructured";
    history.replaceState(null, "", "#" + S.route);
    render(); return;
  }

  const seg = e.target.closest(".seg button");
  if (seg) {
    const key = seg.parentElement.dataset.key, v = seg.dataset.v;
    if (key === "alloy") S.metal.alloy = v; else S[key] = v;
    render(); return;
  }
  const tog = e.target.closest("[data-tog]");
  if (tog) {
    const [scope, key] = tog.dataset.tog.split(".");
    S[scope][key] = !S[scope][key];
    render(); return;
  }
  if (e.target.id === "copywgsl") {
    navigator.clipboard.writeText(WGSL).then(() => {
      e.target.textContent = "Copied · " + WGSL.length + " chars";
      setTimeout(() => { e.target.textContent = "Copy the WGSL"; }, 1600);
    }).catch(() => { e.target.textContent = "Clipboard blocked"; });
  }
});

document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.metalK;
  if (!k) return;
  const v = parseFloat(e.target.value);
  const out = e.target.parentElement.querySelector("output");
  if (k === "__cargo") { S.cargo = CARGO_DEMO.slice(0, v); }
  else if (k === "__acq")  S.acquirePct = v;
  else if (k === "__inst") S.installPct = v;
  else if (k === "__dock") S.dockSeconds = v;
  else S.metal[k] = v;
  if (out) out.textContent = v + (out.textContent.replace(/^[\d.]+/, "") || "");
  // re-render content but keep focus on the slider being dragged
  const id = k, val = e.target.value;
  render();
  const again = document.querySelector(`[data-metal-k="${id}"]`);
  if (again) { again.value = val; again.focus(); }
});

$("#panel").addEventListener("change", e => { if (e.target.id === "apibase") S.apiBase = e.target.value; });

/* ═══ live data ════════════════════════════════════════════════════ */
async function pullLive() {
  const el = $("#datanote"); if (!el) return;
  el.textContent = "reading " + S.apiBase + " …";
  const get = async path => {
    const r = await fetch(S.apiBase + path, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error(path + " → HTTP " + r.status);
    return r.json();
  };
  try {
    const p = await get("/api/compute/local-profile");
    SHIP.name    = p.machine_name || SHIP.name;
    SHIP.chip    = p.chip || SHIP.chip;
    SHIP.os      = "macOS " + (p.os_version || "");
    SHIP.metal   = p.backend_detail || SHIP.metal;
    SHIP.gpu_cores = p.gpu_cores ?? SHIP.gpu_cores;
    if (p.cpu_cores_performance) SHIP.cores = p.cpu_cores_performance + "P + " + p.cpu_cores_efficiency + "E";
    if (p.memory_total_bytes) SHIP.total_bytes = p.memory_total_bytes;
    if (p.memory_limit_bytes) {
      SHIP.usable_bytes  = p.memory_limit_bytes;
      SHIP.usable_source = p.memory_limit_source === "metal" ? "measured" : "estimated";
      SHIP.usable_note   = p.memory_limit_source === "metal"
        ? "Metal's recommended max working set, read from the driver."
        : "derived from the " + RULES.metal_working_set_fraction * 100 + "% rule — the driver would not answer.";
    }
    if (p.disk_free_bytes) SHIP.free_disk_bytes = p.disk_free_bytes;
    // the unknown map IS the unread list — never a hand-written one
    SHIP.unread = Object.entries(p.unknown || {}).map(([k, v]) => [k, String(v)]);

    let rn = "";
    try {
      const raw = await get("/api/runtimes");
      const items = Array.isArray(raw) ? raw : (raw.runtimes || raw.items || []);
      for (const it of items) {
        const st = it.status || it, local = RUNTIMES.find(r => r.id === (it.id || st.runtime_id));
        if (!local) continue;
        local.installed = st.installed ? (st.version || "unknown") : null;
        local.reason    = st.reason || null;
        local.blocked   = st.python_compatible === false;
        local.note      = st.python_note || local.note;
      }
      S.runtimesInstalled = RUNTIMES.filter(r => r.installed).map(r => r.id);
      rn = " · " + items.length + " runtimes checked";
    } catch (e) { rn = " · runtimes: " + e.message; }

    S.liveNote = `<span class="ok">live</span> — ${esc(S.apiBase)} at ${new Date().toTimeString().slice(0,8)}${esc(rn)}.
      Usable memory is <span class="prov measured">${p.memory_limit_source}</span>, ${SHIP.unread.length} field${SHIP.unread.length === 1 ? "" : "s"} unread.`;
    el.innerHTML = S.liveNote;
    render();
  } catch (err) {
    S.liveNote = `<span class="no">could not reach ${esc(S.apiBase)}</span> — ${esc(err.message)}.
      Still showing fixtures, and saying so rather than blanking the screen.`;
    el.innerHTML = S.liveNote;
  }
}
document.addEventListener("click", e => {
  const b = e.target.closest('.seg[data-key="data"] button');
  if (b && b.dataset.v === "live") setTimeout(pullLive, 30);
});

addEventListener("keydown", e => {
  if (e.key === "[" && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { S.railCollapsed = !S.railCollapsed; render(); }
});
/* every state gets a URL — linkable, bookmarkable, and capturable */
function applyHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (!h) return false;
  const [route, ...flags] = h.split("&");
  if (R[route]) S.route = route;
  for (const f of flags) {
    const [k, v] = f.split("=");
    if (k === "theme" && ["system","light","dark"].includes(v)) S.theme = v;
    if (k === "rail" && v === "collapsed") S.railCollapsed = true;
    if (k === "density" && ["dense","sparse"].includes(v)) S.density = v;
    if (k === "cargo") S.cargo = CARGO_DEMO.slice(0, +v || 0);
    if (k === "chrome" && v === "off") document.documentElement.classList.add("bare");
    if (k === "metal" && v === "css") S.power = "low";
    if (k === "motion" && v === "reduced") S.motion = "reduced";
  }
  return true;
}
addEventListener("hashchange", () => { if (applyHash()) render(); });
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (S.theme === "system") render(); });
if (matchMedia("(prefers-reduced-motion: reduce)").matches) S.motion = "reduced";

applyHash();
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
