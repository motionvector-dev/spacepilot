<title>SpacePilot Concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap">
<style>
:root{
  --root:#000;--ground:#050506;--panel:#0a0a0c;--card:#141417;--raised:#1d1d21;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);--line3:rgba(255,255,255,.22);
  --ink:#e4e4e7;--ink2:#a1a1aa;--ink3:#71717a;--ink4:#52525b;
  --true:#4ade80;--wrong:#f43f5e;
  --gold-1:#8a6a22;--gold-2:#c9a227;--gold-3:#f6e6a8;--gold-4:#fffbe8;
  --chrome-1:#545c67;--chrome-2:#a7b0bc;--chrome-3:#e8edf4;--chrome-4:#ffffff;
  --mono:'Geist Mono','JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;--sans:'Geist','Inter',-apple-system,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --root:#fbfaf8;--ground:#f5f4f1;--panel:#fff;--card:#fff;--raised:#eceae5;
    --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.13);--line3:rgba(0,0,0,.2);
    --ink:#1c1c1f;--ink2:#52525b;--ink3:#71717a;--ink4:#a1a1aa;
    --true:#059669;--wrong:#e11d48;
    --gold-1:#37290e;--gold-2:#67511b;--gold-3:#9a7e32;--gold-4:#c9ab5a;
    --chrome-1:#21272f;--chrome-2:#434c58;--chrome-3:#717d8c;--chrome-4:#a4b1bf;
  }
}
:root[data-theme="light"]{
  --root:#fbfaf8;--ground:#f5f4f1;--panel:#fff;--card:#fff;--raised:#eceae5;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.13);--line3:rgba(0,0,0,.2);
  --ink:#1c1c1f;--ink2:#52525b;--ink3:#71717a;--ink4:#a1a1aa;
  --true:#059669;--wrong:#e11d48;
  --gold-1:#37290e;--gold-2:#67511b;--gold-3:#9a7e32;--gold-4:#c9ab5a;
  --chrome-1:#21272f;--chrome-2:#434c58;--chrome-3:#717d8c;--chrome-4:#a4b1bf;
}
:root[data-theme="dark"]{
  --root:#000;--ground:#050506;--panel:#0a0a0c;--card:#141417;--raised:#1d1d21;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);--line3:rgba(255,255,255,.22);
  --ink:#e4e4e7;--ink2:#a1a1aa;--ink3:#71717a;--ink4:#52525b;
  --true:#4ade80;--wrong:#f43f5e;
  --gold-1:#8a6a22;--gold-2:#c9a227;--gold-3:#f6e6a8;--gold-4:#fffbe8;
  --chrome-1:#545c67;--chrome-2:#a7b0bc;--chrome-3:#e8edf4;--chrome-4:#ffffff;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground);color:var(--ink);font-family:var(--sans);overflow-x:hidden;width:100%;height:100%}
body{min-height:100vh}

.metal-chrome{background:linear-gradient(100deg,var(--chrome-2),var(--chrome-3),var(--chrome-4),var(--chrome-3),var(--chrome-1));background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.metal-gold{background:linear-gradient(100deg,var(--gold-1),var(--gold-2),var(--gold-3),var(--gold-4),var(--gold-2));background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* ---------- top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:80;
  display:flex;align-items:center;gap:18px;padding:0 18px;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.wordmark{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.14em}
.wordmark .sub{font-weight:400;color:var(--ink3);letter-spacing:.08em;margin-left:8px;text-transform:lowercase}
.idx-rail{display:flex;gap:4px;margin-left:auto}
.idx-btn{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink3);
  background:transparent;border:1px solid transparent;border-radius:5px;padding:5px 8px;cursor:pointer;
}
.idx-btn:hover{color:var(--ink);border-color:var(--line2)}
.idx-btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:1px}
.idx-btn.active{color:var(--ink);border-color:var(--line3);background:var(--card)}
.theme-toggle{display:flex;gap:2px;background:var(--card);border:1px solid var(--line2);border-radius:7px;padding:2px;margin-left:10px}
.theme-toggle button{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink3);
  background:transparent;border:0;border-radius:5px;padding:5px 9px;cursor:pointer;
}
.theme-toggle button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.theme-toggle button:focus-visible{outline:2px solid var(--gold-2);outline-offset:1px}

/* ---------- wall ---------- */
.wall{padding:88px 32px 140px;display:flex;flex-direction:column;align-items:center;gap:56px}
.wall-row{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
.slot{position:relative;width:calc(1440px * var(--scale));height:calc(900px * var(--scale))}
.slot-label{
  position:absolute;left:2px;top:-24px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;
  color:var(--ink3);white-space:nowrap;
}
.stage-btn{
  all:unset;position:absolute;inset:0;cursor:zoom-in;display:block;border-radius:9px;
}
.stage-btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.stage{
  position:absolute;top:0;left:0;width:1440px;height:900px;
  transform:scale(var(--scale));transform-origin:top left;
  background:var(--panel);border:1px solid var(--line2);border-radius:9px;overflow:hidden;
}
.slot:hover .stage{border-color:var(--line3)}

/* ---------- focus overlay ---------- */
.focus-overlay{
  position:fixed;inset:0;z-index:100;background:var(--ground);
  display:none;align-items:center;justify-content:center;
}
.focus-overlay.active{display:flex}
.focus-stage-wrap{position:relative;width:1440px;height:900px;transform-origin:center center}
.focus-stage-wrap .stage{position:absolute;top:0;left:0;width:1440px;height:900px;transform:none;border-radius:0;border:none}
.focus-label{
  position:fixed;left:24px;top:64px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--ink3);z-index:101;
}
.focus-close{
  position:fixed;right:20px;top:16px;z-index:101;width:32px;height:32px;border-radius:7px;
  background:var(--card);border:1px solid var(--line2);color:var(--ink2);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.focus-close:hover{color:var(--ink);border-color:var(--line3)}
.focus-close:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.focus-nav{
  position:fixed;top:50%;transform:translateY(-50%);z-index:101;width:40px;height:56px;border-radius:8px;
  background:var(--card);border:1px solid var(--line2);color:var(--ink2);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.focus-nav:hover{color:var(--ink);border-color:var(--line3)}
.focus-nav:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.focus-prev{left:20px}
.focus-next{right:20px}

@media(prefers-reduced-motion:no-preference){
  .stage-btn{transition:none}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation-duration:.001s!important}
}

/* ================= FRAME INTERIOR STYLES (authored at 1440x900) ================= */
.f{position:relative;width:1440px;height:900px;padding:72px 88px;overflow:hidden;background:var(--panel)}
.f::before{content:"";position:absolute;inset:0;background:radial-gradient(1100px 460px at 82% -8%, color-mix(in srgb, var(--gold-2) 7%, transparent), transparent 70%);pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:15px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.headline{font-family:var(--sans);font-weight:800;font-size:60px;line-height:1.08;letter-spacing:-.01em;margin-top:18px;max-width:1180px}
.headline .accent{font-weight:800}
.sowhat{position:absolute;left:88px;bottom:96px;font-size:20px;color:var(--ink2);max-width:820px;font-weight:500}
.citation{position:absolute;left:88px;bottom:64px;font-family:var(--mono);font-size:12.5px;color:var(--ink4);letter-spacing:.02em}
.evidence-zone{position:absolute;left:88px;right:88px;top:250px;bottom:150px}

.term{
  background:#0a0a0c;border:1px solid rgba(255,255,255,.1);border-radius:10px;
  font-family:var(--mono);color:#d4d4d8;font-size:15px;line-height:1.75;padding:20px 22px;
}
.term .prompt{color:#71717a}
.term .ok{color:var(--true)}
.term .dim{color:#71717a}
.term .hd{color:#e4e4e7;font-weight:500}

.chip{display:inline-flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:14px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:8px 16px;color:var(--ink)}
.chip b{font-weight:600}
.chip span{color:var(--ink3);font-size:12.5px}

svg text{font-family:var(--sans)}
svg .mono{font-family:var(--mono)}
</style>

    <div class="slot" data-frame="1">
      <div class="slot-label">01 — THE DECISION</div>
      <button class="stage-btn" data-open="1" aria-label="Open frame 01, the decision">
        <div class="stage">
          <div class="f">
            <div class="eyebrow">01 — THE DECISION</div>
            <div class="headline">You decide what to run.<br><span class="metal-chrome">SpacePilot</span> decides how and where.</div>
            <div class="evidence-zone">
              <svg viewBox="0 0 1264 380" width="1264" height="380">
                <line x1="0" y1="330" x2="1264" y2="330" stroke="var(--line)" stroke-width="1"/>

                <text x="520" y="352" class="mono" font-size="14" fill="var(--ink3)">ADOPT OPEN MODELS</text>
                <text x="1060" y="352" class="mono" font-size="14" fill="var(--ink3)">REACH PRODUCTION</text>
                <line x1="60" y1="240" x2="620" y2="70" stroke="var(--ink)" stroke-width="3" fill="none"/>
                <circle cx="60" cy="240" r="5" fill="var(--ink2)"/>
                <circle cx="620" cy="70" r="6" fill="var(--ink)"/>
                <text x="640" y="60" font-size="30" font-weight="800" fill="var(--ink)">79%</text>
                <text x="640" y="88" class="mono" font-size="14" fill="var(--ink2)">adopt open models</text>
                <line x1="60" y1="240" x2="1160" y2="210" stroke="var(--ink3)" stroke-width="3" fill="none" stroke-dasharray="1 0"/>
                <circle cx="1160" cy="210" r="6" fill="var(--ink3)"/>
                <text x="880" y="270" font-size="30" font-weight="800" fill="var(--ink3)">53%</text>
                <text x="880" y="298" class="mono" font-size="14" fill="var(--ink3)">reach production</text>
                <path d="M 660 90 C 700 130, 700 190, 660 205" fill="none" stroke="var(--ink4)" stroke-width="1.5"/>
                <path d="M 1120 195 C 1080 155, 1080 110, 1120 95" fill="none" stroke="var(--ink4)" stroke-width="1.5"/>
                <text x="705" y="150" font-size="16" fill="var(--ink3)" font-weight="500">the gap: tooling and trust —</text>
                <text x="705" y="172" font-size="16" fill="var(--ink3)" font-weight="500">not resources</text>
              </svg>
              <div style="margin-top:14px;font-size:14.5px;color:var(--ink3);max-width:920px;line-height:1.6">
                With company size, closed climbs 54% → 73%; open barely moves, 53% → 57%. Scale rules out a resources explanation.
              </div>
            </div>
            <div class="sowhat">Tooling is the product. Trust is the design language.</div>
            <div class="citation">Mozilla, State of Open Source AI (stateofopensource.ai) · Jul 2026 · n=1,410</div>
          </div>
        </div>
      </button>
    </div>

<div class="focus-overlay" id="focusOverlay" role="dialog" aria-modal="true" aria-label="Frame focus view">
  <div class="focus-label" id="focusLabel"></div>
  <button class="focus-close" id="focusClose" aria-label="Close focus view">✕</button>
  <button class="focus-nav focus-prev" id="focusPrev" aria-label="Previous frame">‹</button>
  <button class="focus-nav focus-next" id="focusNext" aria-label="Next frame">›</button>
  <div class="focus-stage-wrap" id="focusStageWrap"></div>
</div>

<script>
(function(){
  var root = document.documentElement;
  var stored = localStorage.getItem('sp-concept-theme') || 'system';
  function applyTheme(v){
    if(v === 'system'){ root.removeAttribute('data-theme'); }
    else{ root.setAttribute('data-theme', v); }
    document.querySelectorAll('.theme-toggle button').forEach(function(b){
      b.setAttribute('aria-pressed', b.dataset.themeChoice === v ? 'true' : 'false');
    });
  }
  applyTheme(stored);
  document.querySelectorAll('.theme-toggle button').forEach(function(b){
    b.addEventListener('click', function(){
      localStorage.setItem('sp-concept-theme', b.dataset.themeChoice);
      applyTheme(b.dataset.themeChoice);
    });
  });

  function setScale(){
    var w = window.innerWidth;
    var cols = w < 760 ? 1 : 3;
    var pad = w < 760 ? 40 : 64;
    var gap = w < 760 ? 0 : 40;
    var avail = (w - pad - gap * (cols - 1)) / cols;
    var scale = avail / 1440;
    scale = Math.max(0.14, Math.min(0.34, scale));
    document.documentElement.style.setProperty('--scale', scale);
  }
  setScale();
  window.addEventListener('resize', setScale);

  var overlay = document.getElementById('focusOverlay');
  var stageWrap = document.getElementById('focusStageWrap');
  var focusLabel = document.getElementById('focusLabel');
  var current = null;

  function fitFocus(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min((vw - 80) / 1440, (vh - 120) / 900);
    stageWrap.style.transform = 'scale(' + s + ')';
  }

  function openFocus(n){
    var slot = document.querySelector('.slot[data-frame="'+n+'"]');
    if(!slot) return;
    var stage = slot.querySelector('.stage');
    stageWrap.innerHTML = '';
    stageWrap.appendChild(stage.cloneNode(true));
    focusLabel.textContent = slot.querySelector('.slot-label').textContent;
    current = n;
    overlay.classList.add('active');
    fitFocus();
    document.querySelectorAll('.idx-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.goto === String(n));
    });
    document.getElementById('focusClose').focus();
  }
  function closeFocus(){
    overlay.classList.remove('active');
    stageWrap.innerHTML = '';
    current = null;
  }
  function step(delta){
    if(current === null) return;
    var n = ((current - 1 + delta + 8) % 8) + 1;
    openFocus(n);
  }

  document.querySelectorAll('[data-open]').forEach(function(btn){
    btn.addEventListener('click', function(){ openFocus(btn.dataset.open); });
  });
  document.querySelectorAll('[data-goto]').forEach(function(btn){
    btn.addEventListener('click', function(){ openFocus(btn.dataset.goto); });
  });
  document.getElementById('focusClose').addEventListener('click', closeFocus);
  document.getElementById('focusPrev').addEventListener('click', function(){ step(-1); });
  document.getElementById('focusNext').addEventListener('click', function(){ step(1); });
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeFocus(); });
  window.addEventListener('keydown', function(e){
    if(overlay.classList.contains('active')){
      if(e.key === 'Escape') closeFocus();
      else if(e.key === 'ArrowRight') step(1);
      else if(e.key === 'ArrowLeft') step(-1);
    }
  });
  window.addEventListener('resize', fitFocus);
})();
</script>
