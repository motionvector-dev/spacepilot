<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpacePilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 320px;width:1280px;height:854px}
.mark{background:#09090b;display:flex;align-items:center;justify-content:center}
.mark span{font-family:'Geist',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:600;font-size:150px;letter-spacing:-.035em;color:#fafafa;white-space:nowrap;line-height:1}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip i{display:block}
</style>
</head>
<body>
<div class="tile">
<div class="mark"><span>SpacePilot</span></div>
<div class="strip"><i style="background:#c9a227"></i><i style="background:#10b981"></i><i style="background:#a49bd0"></i><i style="background:#f43535"></i></div>
</div>
</body>
</html>
