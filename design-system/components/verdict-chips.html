<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verdict chips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap">
<style>
:root{
  --root:#000000; --ground:#09090b; --panel:#111114; --card:#18181b; --raised:#222226;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#fafafa; --ink2:#a1a1aa; --ink4:#52525b; --wrong:#f43535;
  --silver:#cfd4dc; --silver-line:rgba(207,212,220,.30);
  --mono:'Geist Mono','JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
  --sans:'Geist','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --r2:10px;
}
:root[data-theme="light"]{
  --root:#fdfdfc; --ground:#f7f7f5; --panel:#f2f2ef; --card:#ffffff; --raised:#e6e6e1;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
  --ink:#09090b; --ink2:#52525b; --ink4:#a1a1aa; --wrong:#e11d48;
  --silver:#5c6672; --silver-line:rgba(92,102,114,.32);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --root:#000000; --ground:#09090b; --panel:#111114; --card:#18181b; --raised:#222226;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#fafafa; --ink2:#a1a1aa; --ink4:#52525b; --wrong:#f43535;
  --silver:#cfd4dc; --silver-line:rgba(207,212,220,.30);
}}
:root[data-theme="dark"]{
  --root:#000000; --ground:#09090b; --panel:#111114; --card:#18181b; --raised:#222226;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#fafafa; --ink2:#a1a1aa; --ink4:#52525b; --wrong:#f43535;
  --silver:#cfd4dc; --silver-line:rgba(207,212,220,.30);
}
*{box-sizing:border-box}
body{margin:0;background:var(--root);color:var(--ink);font-family:var(--sans);font-size:13px;padding:20px}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink4);margin-bottom:6px}
.k{font-family:var(--mono);font-size:12px}
.dim2{color:var(--ink4)}
.no{color:var(--wrong)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:5px;
  border:1px solid var(--line);color:var(--ink2);background:var(--card);white-space:nowrap}
.chip.tight{color:var(--silver);background:var(--raised);border-color:var(--silver-line);letter-spacing:.02em}
</style>
</head>
<body>
  <div class="lbl">Verdict &middot; fits / tight platinum / won't fit / not supported</div>
  <div class="card">
    <span class="k">fits</span>
    <span class="chip tight">fits, tight</span>
    <span class="k no">won't fit</span>
    <span class="k dim2">not supported</span>
  </div>
</body>
</html>
