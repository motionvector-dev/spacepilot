<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="750" height="480" style="background:#09090b; font-family:'Courier New', monospace;">
  <style>
    .border { stroke: #27272a; stroke-width: 2; fill: none; }
    .line { stroke: #e4e4e7; stroke-width: 2; fill: none; stroke-linecap: round; }
    .box { stroke: #3f3f46; stroke-width: 1.5; fill: #18181b; }
    .text { fill: #fafafa; font-size: 14px; }
    .subtext { fill: #a1a1aa; font-size: 11px; }
    .accent { fill: #f43f5e; font-weight: bold; }
    .green { fill: #10b981; font-weight: bold; }
    .cloud { stroke: #71717a; stroke-dasharray: 4,4; fill: #111114; stroke-width: 1.5; }
  </style>

  <!-- Panel Border -->
  <rect x="20" y="20" width="710" height="440" class="border" rx="10"/>

  <!-- Title -->
  <text x="40" y="55" class="text" style="font-size: 18px; font-weight: bold;">xkcd #2026: THE SOVEREIGNTY TAX</text>
  <line x1="40" y1="65" x2="710" y2="65" class="line" style="stroke:#27272a;"/>

  <!-- Left Side: The "Free Cloud Tier" Illusion -->
  <g transform="translate(50, 90)">
    <text x="0" y="20" class="text" style="font-weight: bold;">JUNE 2026: "ENTERPRISE PIVOT"</text>
    
    <!-- Stick Figure Founder -->
    <circle cx="60" cy="80" r="16" class="line"/>
    <line x1="60" y1="96" x2="60" y2="150" class="line"/>
    <line x1="60" y1="110" x2="20" y2="135" class="line"/>
    <line x1="60" y1="110" x2="100" y2="135" class="line"/>
    <line x1="60" y1="150" x2="30" y2="210" class="line"/>
    <line x1="60" y1="150" x2="90" y2="210" class="line"/>

    <!-- Speech Bubble -->
    <rect x="110" y="60" width="180" height="75" class="box" rx="6"/>
    <text x="120" y="82" class="subtext" style="fill:#fb7185;">"We are sunsetting</text>
    <text x="120" y="98" class="subtext" style="fill:#fb7185;">the Free Tier to focus</text>
    <text x="120" y="114" class="subtext" style="fill:#fb7185;">on Enterprise Value."</text>

    <!-- Cut wire to user device -->
    <line x1="60" y1="240" x2="60" y2="290" class="line" style="stroke:#f43f5e; stroke-dasharray: 4,4;"/>
    <text x="75" y="270" class="accent">401 UNAUTHORIZED</text>
  </g>

  <!-- Divider -->
  <line x1="380" y1="90" x2="380" y2="420" class="border"/>

  <!-- Right Side: SpacePilot On-Device Truth -->
  <g transform="translate(420, 90)">
    <text x="0" y="20" class="text" style="font-weight: bold;">APPLE SILICON (SPACEPILOT)</text>

    <!-- Mac Laptop & Sound Waves -->
    <rect x="30" y="130" width="120" height="70" class="box" rx="4"/>
    <rect x="20" y="200" width="140" height="8" class="box" rx="2"/>
    <text x="45" y="170" class="green" style="font-size: 13px;">ONNX / ANE</text>

    <!-- Stick Figure Developer -->
    <circle cx="230" cy="110" r="16" class="line"/>
    <line x1="230" y1="126" x2="230" y2="180" class="line"/>
    <line x1="230" y1="140" x2="190" y2="165" class="line"/>
    <line x1="230" y1="140" x2="270" y2="165" class="line"/>
    <line x1="230" y1="180" x2="200" y2="240" class="line"/>
    <line x1="230" y1="180" x2="260" y2="240" class="line"/>

    <!-- Speech Bubble -->
    <rect x="160" y="40" width="130" height="40" class="box" rx="6"/>
    <text x="175" y="65" class="green">"Hey Space..."</text>

    <!-- Zero Cloud Telemetry Badge -->
    <rect x="20" y="250" width="260" height="50" class="box" style="stroke:#10b981; fill:#064e3b; fill-opacity:0.2;" rx="6"/>
    <text x="35" y="272" class="green" style="font-size: 11px;">✓ 0% Cloud Dependency</text>
    <text x="35" y="288" class="subtext">✓ openWakeWord ONNX (200 KB)</text>
  </g>

  <!-- Footer Alt Text -->
  <text x="40" y="435" class="subtext" style="font-style: italic;">
    Alt text: "Every proprietary free tier eventually turns into an invoice. Math on your own Neural Engine stays free forever."
  </text>
</svg>
