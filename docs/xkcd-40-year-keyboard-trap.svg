<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#09090b; font-family:'Comic Sans MS', 'Chalkboard SE', 'Courier New', monospace;">
  <style>
    .border { stroke: #27272a; stroke-width: 2; fill: none; }
    .line { stroke: #f4f4f5; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    .box { stroke: #3f3f46; stroke-width: 1.5; fill: #18181b; }
    .panel-line { stroke: #27272a; stroke-width: 1.5; }
    .title { fill: #fafafa; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
    .subtitle { fill: #a1a1aa; font-size: 14px; }
    .text { fill: #f4f4f5; font-size: 14px; }
    .small-text { fill: #a1a1aa; font-size: 12px; }
    .punch { fill: #f43f5e; font-size: 15px; font-weight: bold; }
    .green { fill: #10b981; font-size: 15px; font-weight: bold; }
    .cyan { fill: #06b6d4; font-weight: bold; }
  </style>

  <!-- Outer Canvas Border -->
  <rect x="20" y="20" width="1160" height="635" class="border" rx="12"/>

  <!-- Header Banner -->
  <text x="50" y="65" class="title">xkcd: THE 40-YEAR PLASTIC PRISON (1984 – 2026)</text>
  <text x="50" y="90" class="subtitle">Why are humans still sliding plastic mice on desks when we should be piloting starships?</text>
  <line x1="50" y1="105" x2="1150" y2="105" class="panel-line"/>

  <!-- 3 Evolution Panels -->
  
  <!-- PANEL 1: 1984 (The GUI Revolution) -->
  <rect x="50" y="130" width="340" height="420" class="box" rx="8"/>
  <text x="75" y="165" class="text" style="font-weight:bold;">1984: "THE MACINTOSH"</text>
  <text x="75" y="185" class="small-text">Clicking 16px squares with a ball mouse.</text>
  
  <!-- Stick Figure 1984 -->
  <g transform="translate(150, 240)">
    <circle cx="60" cy="50" r="16" class="line"/>
    <line x1="60" y1="66" x2="60" y2="130" class="line"/>
    <line x1="60" y1="80" x2="20" y2="105" class="line"/>
    <line x1="60" y1="80" x2="100" y2="105" class="line"/>
    <line x1="60" y1="130" x2="30" y2="180" class="line"/>
    <line x1="60" y1="130" x2="90" y2="180" class="line"/>
    <!-- Mac Desk -->
    <rect x="-10" y="105" width="40" height="30" class="line"/>
    <rect x="70" y="105" width="20" height="10" rx="3" class="line"/>
  </g>
  <text x="75" y="470" class="small-text">"Look! I moved a pixelated</text>
  <text x="75" y="490" class="small-text">folder across the screen!"</text>
  <text x="75" y="525" class="cyan">Human Bandwidth: 30 WPM</text>

  <!-- PANEL 2: 2024 (The 40-Year Trap) -->
  <rect x="425" y="130" width="340" height="420" class="box" rx="8"/>
  <text x="450" y="165" class="text" style="font-weight:bold;">2024: "THE DESK PRISON"</text>
  <text x="450" y="185" class="small-text">Still hunched over plastic keys in 4K.</text>

  <!-- Stick Figure 2024 (Hunched / Exhausted) -->
  <g transform="translate(525, 240)">
    <circle cx="60" cy="55" r="16" class="line"/>
    <line x1="60" y1="71" x2="45" y2="135" class="line"/>
    <line x1="55" y1="85" x2="10" y2="110" class="line"/>
    <line x1="55" y1="85" x2="95" y2="110" class="line"/>
    <line x1="45" y1="135" x2="20" y2="185" class="line"/>
    <line x1="45" y1="135" x2="75" y2="185" class="line"/>
    <!-- 3 Monitors surround -->
    <rect x="-20" y="80" width="35" height="45" class="line"/>
    <rect x="25" y="70" width="45" height="55" class="line"/>
    <rect x="80" y="80" width="35" height="45" class="line"/>
  </g>
  <text x="450" y="470" class="punch">"40 years later... still sliding</text>
  <text x="450" y="490" class="punch">plastic to click dropdown menus."</text>
  <text x="450" y="525" class="small-text">Carpal tunnel &amp; 15% cloud margins.</text>

  <!-- PANEL 3: 2026+ (SpacePilot Sovereign Starship) -->
  <rect x="800" y="130" width="340" height="420" class="box" style="stroke:#3b82f6; fill:#0f172a; fill-opacity:0.4;" rx="8"/>
  <text x="825" y="165" class="green" style="font-weight:bold;">2026+: "SOVEREIGN INTENT"</text>
  <text x="825" y="185" class="small-text">Voice, ANE Vector Heads &amp; Starships.</text>

  <!-- Stick Figure 2026 (Floating / Free) -->
  <g transform="translate(900, 220)">
    <circle cx="60" cy="40" r="16" class="line" style="stroke:#10b981;"/>
    <line x1="60" y1="56" x2="60" y2="120" class="line" style="stroke:#10b981;"/>
    <line x1="60" y1="70" x2="20" y2="40" class="line" style="stroke:#10b981;"/>
    <line x1="60" y1="70" x2="100" y2="40" class="line" style="stroke:#10b981;"/>
    <line x1="60" y1="120" x2="35" y2="170" class="line" style="stroke:#10b981;"/>
    <line x1="60" y1="120" x2="85" y2="170" class="line" style="stroke:#10b981;"/>
    
    <!-- Glowing Aurora HUD -->
    <circle cx="60" cy="40" r="45" class="line" style="stroke:#3b82f6; stroke-dasharray: 4,4; opacity:0.8;"/>
  </g>
  <text x="825" y="450" class="green">"Space, render the artificial</text>
  <text x="825" y="470" class="green">universe at 120 FPS."</text>
  <text x="825" y="505" class="cyan">85µs ANE · $0.00 · Zero Plastic</text>
  <text x="825" y="525" class="small-text">Bandwidth: Speed of Human Thought.</text>

  <!-- Footer Punchline -->
  <text x="50" y="605" class="small-text" style="font-style: italic;">
    Alt text: "Humans didn't evolve brains capable of general relativity just to hunt through File &gt; Export &gt; MP4 for four decades."
  </text>
</svg>
